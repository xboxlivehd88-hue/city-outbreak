name: v403 temporary validation
on:
  push:
    paths:
      - '.github/workflows/v403-temp-validation.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v403
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=403' index.html
          grep -Fq 'This produces true hinged body sections' src/game.js
          grep -Fq 'chooseRigidBone(cx,cy,cz)' src/game.js
          grep -Fq 'if(lua)lua.rotation.set(armBase-s*armAmp-attack*.42,0,.34)' src/game.js
          grep -Fq 'wob2=Math.sin(age*10.7' src/game.js
          grep -Fq '(z.radiatedGreenVisual||z.walkerVisual)?radiatedSpinTopTarget(z):null' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
