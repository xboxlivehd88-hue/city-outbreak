name: CITY OUTBREAK v142 boss pursuit pressure
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "f803711421f264f63241df4c1ea5a8a3b6faf5b9"
      - name: Apply v142 patch
        run: python3 .github/city-outbreak-v142-boss-pressure.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v142.js").write_text(inline,encoding="utf-8")
          assert "BOSS_CHARGE_MAX_RANGE=32,BOSS_CHARGE_SPEED=7.6" in inline
          assert "bossPressureSpeed(playerDistToZombie,z.speed)" in inline
          PY
          node --check /tmp/city-outbreak-v142.js
          git diff --check
      - name: Commit v142
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve boss pursuit pressure and Gore Rush v142"
          git push origin HEAD:main
