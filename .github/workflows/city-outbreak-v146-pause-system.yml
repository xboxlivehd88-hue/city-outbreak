name: CITY OUTBREAK v146 pause system
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "cc0b7fa27d8ff9ada330469913a91f948935a603"
      - name: Apply v146 patch
        run: python3 .github/city-outbreak-v146-pause-system.py
      - name: Validate JavaScript and pause wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v146.js").write_text(inline,encoding="utf-8")
          assert 'id="pauseOverlay"' in html
          assert 'id="pauseBtn"' in html
          assert 'function setGamePaused(next)' in inline
          assert 'if(!paused)update(dt)' in inline
          assert 'gameTimeout(()=>{' in inline
          assert 'runStartTime=gameTimeNow()' in inline
          assert 'if(running&&!dying&&!between&&!paused)setGamePaused(true)' in inline
          PY
          node --check /tmp/city-outbreak-v146.js
          git diff --check
      - name: Commit v146
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add true pause and resume system v146"
          git push origin HEAD:main
