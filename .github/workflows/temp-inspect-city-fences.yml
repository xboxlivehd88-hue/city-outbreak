name: v405 temporary validation
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-city-fences.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v405
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=405' index.html
          grep -Fq 'function addWestBoundaryHouseGapFences(map)' src/game.js
          grep -Fq 'addWestBoundaryHouseGapFences(map);' src/game.js
          grep -Fq 'source:"v405WestBoundaryFence"' src/game.js
          grep -Fq 'BoundaryFence_WestRow_A' src/game.js
          grep -Fq 'BoundaryFence_WestRow_B' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
