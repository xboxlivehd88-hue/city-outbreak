name: inspect city object prefixes
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-city-fences.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List root object names
        run: |
          python3 - <<'PY'
          import json,struct,re,collections
          from pathlib import Path
          b=Path('assets/chicken_gun_fruzer_-_city.glb').read_bytes()
          n,t=struct.unpack_from('<II',b,12)
          g=json.loads(b[20:20+n].decode('utf-8').rstrip('\x00 '))
          nodes=g.get('nodes',[])
          parents={}
          for i,node in enumerate(nodes):
            for ch in node.get('children',[]):parents[ch]=i
          roots=[(i,n.get('name','')) for i,n in enumerate(nodes) if i not in parents]
          print('ROOTS',len(roots))
          for i,name in roots:
            print(i,name)
          PY
