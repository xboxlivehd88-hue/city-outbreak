name: v182 cleanup validation
on:
  push:
    paths:
      - '.github/workflows/v182-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        continue-on-error: true
        run: |
          git diff --check HEAD^ HEAD
          grep -Fq 'assets/2018_subaru_wrx_sti.glb' index.html
          grep -Fq 'MAX_ACTIVE_ZOMBIES=20' index.html
          grep -Fq 'assets/classic_m4.glb.glb' index.html
          grep -Fq 'assets/low-poly_sig_sauer_m17.glb' index.html
          ! grep -Fq 'isPickup' index.html
          ! grep -Fq 'isSUV' index.html
          ! grep -Fq 'isWagon' index.html
          ! grep -Fq 'isHatch' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.rfind('<script type="module">'); a=s.find('>',a)+1; b=s.find('</script>',a)
          Path('/tmp/game.mjs').write_text(s[a:b])
          PY
          node --check /tmp/game.mjs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser smoke
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          cat > /tmp/smoke.cjs <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}),p=await b.newPage();
            const errs=[];p.on('pageerror',e=>errs.push(String(e)));
            await p.goto('http://127.0.0.1:4173/?debug=1',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>+(document.documentElement.dataset.stiVisuals||0)>=12,null,{timeout:60000});
            const n=+(await p.locator('html').getAttribute('data-sti-visuals')||0);
            if(n!==12)throw Error('Expected 12 STI visuals, got '+n);
            await p.locator('#start').click();await p.waitForTimeout(1200);
            if(await p.locator('#startScreen').evaluate(e=>getComputedStyle(e).display)!=='none')throw Error('START failed');
            if(errs.length)throw Error(errs.join(' | '));
            console.log('PASS STI-only cars',n);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/smoke.cjs
