name: v395 temporary validation
on:
  push:
    paths:
      - '.github/workflows/v395-inspect-green-guy.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diff and syntax
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq 'assets/green%20guy.glb?v=395' src/game.js
          grep -Fq 'RadiatedGreenGuyAutoRig' src/game.js
          grep -Fq 'holder.rotation.y=Math.PI' src/game.js
          grep -Fq './src/game.js?v=395' index.html
      - name: Confirm source GLB remains static
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          b=Path('assets/green guy.glb').read_bytes()
          n,t=struct.unpack_from('<II',b,12)
          g=json.loads(b[20:20+n].decode('utf-8').rstrip('\x00 '))
          assert not g.get('skins'), 'unexpected authored skin added'
          assert not g.get('animations'), 'unexpected authored animation added'
          assert len(g.get('meshes',[]))==3
          print('PASS static source GLB: runtime auto-rig required')
          PY

# trigger v395 validation
