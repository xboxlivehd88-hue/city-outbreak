name: Inspect Trailer Entrance Geometry

on:
  push:
    paths:
      - '.github/workflows/inspect-trailer-entrances.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze meshes around exterior doors
        run: |
          python3 - <<'PY'
          import json,struct,math,re
          p='assets/trailer_park.glb'
          with open(p,'rb') as f:
              magic,ver,total=struct.unpack('<4sII',f.read(12))
              n,typ=struct.unpack('<II',f.read(8))
              g=json.loads(f.read(n).decode('utf-8').rstrip('\x00 '))
          nodes=g.get('nodes',[]); meshes=g.get('meshes',[]); acc=g.get('accessors',[])
          parents=[None]*len(nodes)
          for i,n in enumerate(nodes):
              for ch in n.get('children',[]): parents[ch]=i
          def mm(a,b):
              return [[sum(a[r][k]*b[k][c] for k in range(4)) for c in range(4)] for r in range(4)]
          def local(n):
              if 'matrix' in n:
                  m=n['matrix']; return [[m[c*4+r] for c in range(4)] for r in range(4)]
              t=n.get('translation',[0,0,0]);s=n.get('scale',[1,1,1]);q=n.get('rotation',[0,0,0,1]);x,y,z,w=q
              R=[[1-2*y*y-2*z*z,2*x*y-2*z*w,2*x*z+2*y*w,0],
                 [2*x*y+2*z*w,1-2*x*x-2*z*z,2*y*z-2*x*w,0],
                 [2*x*z-2*y*w,2*y*z+2*x*w,1-2*x*x-2*y*y,0],[0,0,0,1]]
              S=[[s[0],0,0,0],[0,s[1],0,0],[0,0,s[2],0],[0,0,0,1]]
              M=mm(R,S);M[0][3]=t[0];M[1][3]=t[1];M[2][3]=t[2];return M
          cache={}
          def world(i):
              if i in cache:return cache[i]
              m=local(nodes[i]);pa=parents[i];cache[i]=m if pa is None else mm(world(pa),m);return cache[i]
          def tx(M,p):
              x,y,z=p
              return (M[0][0]*x+M[0][1]*y+M[0][2]*z+M[0][3],M[1][0]*x+M[1][1]*y+M[1][2]*z+M[1][3],M[2][0]*x+M[2][1]*y+M[2][2]*z+M[2][3])
          def bounds(mi):
              lo=[1e30]*3;hi=[-1e30]*3;ok=False
              for pr in meshes[mi].get('primitives',[]):
                  ai=pr.get('attributes',{}).get('POSITION')
                  if ai is None:continue
                  a=acc[ai]
                  if 'min' not in a or 'max' not in a:continue
                  ok=True
                  for k in range(3):lo[k]=min(lo[k],a['min'][k]);hi[k]=max(hi[k],a['max'][k])
              return (lo,hi) if ok else None
          rows=[]
          for i,n in enumerate(nodes):
              mi=n.get('mesh')
              if mi is None:continue
              b=bounds(mi)
              if not b:continue
              lo,hi=b;M=world(i)
              pts=[tx(M,(x,y,z)) for x in (lo[0],hi[0]) for y in (lo[1],hi[1]) for z in (lo[2],hi[2])]
              mn=[min(v[k] for v in pts) for k in range(3)];mx=[max(v[k] for v in pts) for k in range(3)]
              mn=[mn[0]*1.25,mn[1]*1.25+.97,mn[2]*1.25];mx=[mx[0]*1.25,mx[1]*1.25+.97,mx[2]*1.25]
              name=n.get('name') or meshes[mi].get('name') or ''
              c=((mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2)
              s=(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])
              rows.append((name,c,s,mn,mx,i,parents[i]))
          doors=[r for r in rows if re.match(r'^Door(?:\.\d+)?_Door_0$',r[0],re.I)]
          for di,d in enumerate(doors):
              name,dc,ds,dmn,dmx,node,pa=d
              print('\n### EXTERIOR DOOR',di,name,'CENTER',tuple(round(v,3) for v in dc))
              near=[]
              for r in rows:
                  n,c,s,mn,mx,i,p=r
                  dx=c[0]-dc[0];dz=c[2]-dc[2]
                  if math.hypot(dx,dz)<=6.5 and -0.25<=mn[1]<=4.8:
                      near.append((math.hypot(dx,dz),r))
              for dist,r in sorted(near,key=lambda x:(x[0],x[1][0]))[:90]:
                  n,c,s,mn,mx,i,p=r
                  print(f'{dist:5.2f}',n,'center',round(c[0],3),round(c[1],3),round(c[2],3),'size',round(s[0],3),round(s[1],3),round(s[2],3),'y',round(mn[1],3),round(mx[1],3),'node',i,'parent',p)
          PY
