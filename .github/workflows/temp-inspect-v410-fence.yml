name: v411 temporary validation
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-v410-fence.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v411
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=411' index.html
          grep -Fq 'PhotoMatchedHouseGapFence_v411' src/game.js
          grep -Fq 'new THREE.Vector3(-9.64,center.y,76.226)' src/game.js
          grep -Fq 'left:"House_03__1_",right:"House_04__2_"' src/game.js
          grep -Fq 'targetLocal.sub(currentLocal)' src/game.js
          grep -Fq 'source:"v411PhotoGapFence"' src/game.js
          test "$(grep -Fc 'addPhotoMatchedHouseGapFence(map);' src/game.js)" -eq 1
          ! grep -Fq 'source:"v410PhotoGapFence"' src/game.js
          grep -Fq 'const copyRagdollArm=(dst,key,zBias)=>' src/game.js
          grep -Fq 'const supportLua=rigBone(z,"L_UpperArm")' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
