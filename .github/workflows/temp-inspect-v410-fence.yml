name: find real house alleys
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-v410-fence.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate player-width ground alleys near roads
        run: |
          python3 - <<'PY'
          import json,struct,math,re
          from pathlib import Path
          b=Path('assets/chicken_gun_fruzer_-_city.glb').read_bytes()
          pos=12;n,t=struct.unpack_from('<II',b,pos);pos+=8
          g=json.loads(b[pos:pos+n].decode('utf-8').rstrip('\x00 '));pos+=n
          while pos%4:pos+=1
          bl,bt=struct.unpack_from('<II',b,pos);pos+=8;blob=b[pos:pos+bl]
          nodes=g['nodes'];parents={}
          for i,node in enumerate(nodes):
            for ch in node.get('children',[]):parents[ch]=i
          cts={5120:'b',5121:'B',5122:'h',5123:'H',5125:'I',5126:'f'};cs={5120:1,5121:1,5122:2,5123:2,5125:4,5126:4};comps={'SCALAR':1,'VEC2':2,'VEC3':3,'VEC4':4,'MAT4':16}
          def acc(ai):
            a=g['accessors'][ai];bv=g['bufferViews'][a['bufferView']];ct=a['componentType'];nc=comps[a['type']];fmt='<'+cts[ct]*nc;stride=bv.get('byteStride',cs[ct]*nc);off=bv.get('byteOffset',0)+a.get('byteOffset',0)
            return [struct.unpack_from(fmt,blob,off+i*stride) for i in range(a['count'])]
          def mm(a,b):
            r=[0.0]*16
            for c in range(4):
              for row in range(4):r[c*4+row]=sum(a[k*4+row]*b[c*4+k] for k in range(4))
            return r
          def trs(n):
            if 'matrix' in n:return n['matrix']
            t=n.get('translation',[0,0,0]);s=n.get('scale',[1,1,1]);q=n.get('rotation',[0,0,0,1]);x,y,z,w=q
            r=[1-2*y*y-2*z*z,2*x*y+2*w*z,2*x*z-2*w*y,0,2*x*y-2*w*z,1-2*x*x-2*z*z,2*y*z+2*w*x,0,2*x*z+2*w*y,2*y*z-2*w*x,1-2*x*x-2*y*y,0,0,0,0,1]
            r[0]*=s[0];r[1]*=s[0];r[2]*=s[0];r[4]*=s[1];r[5]*=s[1];r[6]*=s[1];r[8]*=s[2];r[9]*=s[2];r[10]*=s[2];r[12],r[13],r[14]=t
            return r
          world={}
          def wm(i):
            if i in world:return world[i]
            m=trs(nodes[i]);p=parents.get(i);world[i]=mm(wm(p),m) if p is not None else m;return world[i]
          def tp(m,p):
            x,y,z=p;return(m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14])
          def descendants(root):
            out=[];stack=[root]
            while stack:
              i=stack.pop();out.append(i);stack.extend(nodes[i].get('children',[]))
            return out
          def gamep(p):return(21.33575+p[0]*1.55,28.68275+p[1]*1.55,8.25+p[2]*1.55)
          cache={}
          def lowbbox(root):
            if root in cache:return cache[root]
            pts=[]
            for i in descendants(root):
              mi=nodes[i].get('mesh')
              if mi is None:continue
              M=wm(i)
              for pr in g['meshes'][mi].get('primitives',[]):
                pa=pr.get('attributes',{}).get('POSITION')
                if pa is None:continue
                for p in acc(pa):
                  q=gamep(tp(M,p))
                  if -.2<=q[1]<=3.2:pts.append(q)
            if not pts:return None
            bb=(min(p[0] for p in pts),max(p[0] for p in pts),min(p[2] for p in pts),max(p[2] for p in pts));cache[root]=bb;return bb
          houses=[]
          roads=[]
          for i,nod in enumerate(nodes):
            name=nod.get('name','')
            if 'LowPolyFPS' in name:continue
            if name.startswith('House_'):
              bb=lowbbox(i)
              if bb:houses.append((i,name,bb))
            elif re.match(r'^(Road_|ParkingBG_)',name):
              bb=lowbbox(i)
              if bb:roads.append((i,name,bb))
          def rectdist(px,pz,bb):
            x0,x1,z0,z1=bb
            dx=0 if x0<=px<=x1 else min(abs(px-x0),abs(px-x1))
            dz=0 if z0<=pz<=z1 else min(abs(pz-z0),abs(pz-z1))
            return math.hypot(dx,dz)
          out=[]
          for ai,a in enumerate(houses):
            ia,na,A=a;ax0,ax1,az0,az1=A
            for b in houses[ai+1:]:
              ib,nb,B=b;bx0,bx1,bz0,bz1=B
              xov=max(0,min(ax1,bx1)-max(ax0,bx0));zov=max(0,min(az1,bz1)-max(az0,bz0))
              # gap along X, buildings overlap in Z
              xgap=max(bx0-ax1,ax0-bx1,0)
              if .65<=xgap<=2.6 and zov>=4.0:
                midx=(ax1+bx0)/2 if ax1<bx0 else (bx1+ax0)/2
                midz=(max(az0,bz0)+min(az1,bz1))/2
                nr=min((rectdist(midx,midz,r[2]),r[0],r[1],r[2]) for r in roads) if roads else (999,None,None,None)
                out.append((nr[0],'X',xgap,midx,midz,ia,na,A,ib,nb,B,nr[1],nr[2],nr[3]))
              # gap along Z, buildings overlap in X
              zgap=max(bz0-az1,az0-bz1,0)
              if .65<=zgap<=2.6 and xov>=4.0:
                midx=(max(ax0,bx0)+min(ax1,bx1))/2
                midz=(az1+bz0)/2 if az1<bz0 else (bz1+az0)/2
                nr=min((rectdist(midx,midz,r[2]),r[0],r[1],r[2]) for r in roads) if roads else (999,None,None,None)
                out.append((nr[0],'Z',zgap,midx,midz,ia,na,A,ib,nb,B,nr[1],nr[2],nr[3]))
          out.sort(key=lambda x:(x[0],abs(x[2]-1.58)))
          print('=== ALLEYS ===')
          for row in out[:80]:
            rd,axis,gap,mx,mz,ia,na,A,ib,nb,B,ri,rn,R=row
            print('ROAD_D',round(rd,2),'AXIS',axis,'GAP',round(gap,3),'MID',round(mx,3),round(mz,3),
                  ia,na,tuple(round(v,2) for v in A),ib,nb,tuple(round(v,2) for v in B),
                  'ROAD',ri,rn,tuple(round(v,2) for v in R) if R else None)
          PY
