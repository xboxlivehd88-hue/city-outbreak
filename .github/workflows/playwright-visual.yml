name: Playwright visual smoke tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'assets/**'
      - 'tests/visual/**'
      - 'tests/performance/**'
      - '.github/workflows/playwright-visual.yml'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve exact checked-out commit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/city-http.log 2>&1 &
      - name: Verify performance hotpath invariants
        run: node --test tests/performance/hotpaths.test.mjs
      - name: Run visual smoke tests
        env:
          CITY_TEST_URL: http://127.0.0.1:8765
        run: node --test tests/visual/game-smoke.test.mjs
      - name: Save screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: city-outbreak-visual-${{ github.run_number }}
          path: test-results/visual/
          if-no-files-found: warn
          retention-days: 14
