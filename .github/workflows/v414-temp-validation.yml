name: v414 temporary validation
on:
  push:
    paths:
      - '.github/workflows/v414-temp-validation.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v414
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=414' index.html
          grep -Fq 'unpowered:true,active:true' src/game.js
          grep -Fq 'function ragSoftLimitAcceleration' src/game.js
          grep -Fq 'function ragdollBodyContactState' src/game.js
          grep -Fq 'if(z.ragdoll?.active!==false)updateRagdoll(z,dt);' src/game.js
          ! grep -Fq 'r.t>1.90&&r.grounded' src/game.js
          grep -Fq 'function syncCustomVisualFromRagdoll' src/game.js
          grep -Fq 'PhotoMatchedHouseGapFence_v412' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
