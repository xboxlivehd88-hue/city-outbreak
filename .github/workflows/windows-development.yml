name: Windows Development Edition — Security Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-development.yml'
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enforce project security policy before building
        run: node scripts/security/release-guard.cjs
      - name: Verify policy rejects unsafe changes
        run: node --test scripts/security/release-guard.test.cjs
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Audit ALL desktop dependencies including build tooling
        working-directory: desktop
        run: npm audit --audit-level=moderate
      - name: Test offline desktop asset server and boundaries
        working-directory: desktop
        run: npm test
      - name: Verify runtime and original model assets
        shell: pwsh
        run: |
          if (!(Test-Path 'assets/chicken_gun_fruzer_-_city.glb')) { throw 'Original city GLB missing' }
          if (!(Test-Path 'assets/low-poly_sig_sauer_m17.glb')) { throw 'Original M17 GLB missing' }
          if (!(Test-Path 'desktop/node_modules/three/build/three.module.js')) { throw 'Offline Three.js missing' }
      - name: Package unpacked Windows app for REAL startup test
        working-directory: desktop
        run: npx electron-builder --dir --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify original Three.js GLTFLoader exists inside packaged app
        shell: pwsh
        run: |
          $vendor = 'desktop-dist/win-unpacked/resources/vendor/three'
          foreach ($file in @('build/three.module.js', 'examples/jsm/loaders/GLTFLoader.js', 'examples/jsm/utils/SkeletonUtils.js', 'examples/jsm/utils/BufferGeometryUtils.js')) {
            if (!(Test-Path (Join-Path $vendor $file))) { throw "Packaged Three.js module is missing: $file" }
          }
      - name: Real packaged Windows game startup test (START GAME must work)
        working-directory: desktop
        run: node test/windows-startup-smoke.cjs
        timeout-minutes: 5
      - name: Build portable Windows executable ONLY after startup succeeds
        working-directory: desktop
        run: npm run build:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Microsoft Defender scan and SHA-256 evidence (FAIL CLOSED)
        shell: pwsh
        run: ./desktop/scripts/verify-windows-release.ps1
      - name: Attest security-checked Windows executable provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'desktop-dist/*.exe'
      - name: Save Windows startup screenshots and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: city-outbreak-windows-startup-diagnostics
          path: test-results/windows/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload ONLY security-checked Windows development build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: city-outbreak-windows-security-checked
          path: |
            desktop-dist/*.exe
            desktop-dist/SHA256SUMS.txt
            desktop-dist/SECURITY-REPORT.json
          if-no-files-found: error
          retention-days: 14
