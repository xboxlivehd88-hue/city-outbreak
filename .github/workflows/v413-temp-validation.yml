name: v413 temporary validation
on:
  push:
    paths:
      - '.github/workflows/v413-temp-validation.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v413
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=413' index.html
          grep -Fq 'function syncCustomVisualFromRagdoll(z,bones,holder,storeKey)' src/game.js
          grep -Fq 'state.o.rotation.x-state.sx' src/game.js
          grep -Fq 'syncCustomVisualFromRagdoll(z,bones,h,"radiatedVisibleRagdollBase")' src/game.js
          grep -Fq 'syncCustomVisualFromRagdoll(z,bones,holder,"walkerVisibleRagdollBase")' src/game.js
          grep -Fq '// v358: Hairibar-inspired joint-space ragdoll for explosive deaths.' src/game.js
          grep -Fq 'PhotoMatchedHouseGapFence_v412' src/game.js
          grep -Fq 'targetLong=1.72' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
