name: v181 validation
on:
  push:
    paths:
      - '.github/workflows/v181-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation
        run: |
          git diff --check HEAD^ HEAD
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks={
            'M4 exact pre-v171 damage':'rifle:{name:"M4 CARBINE",rate:105,hold:190,spread:.004,pellets:1,body:1,recoil:.105,baseMag:12}' in s,
            'M4 finite ammo':'const infiniteStarterAmmo=weapon==="pistol";' in s and 'if(!infiniteStarterAmmo)A().mag--' in s,
            'M4 reload enabled':"function reload(w=weapon){if(w==='pistol')" in s,
            'M4 ammo shop':'data-buy="rifleAmmo"' in s,
            'M4 GLB':'assets/classic_m4.glb.glb' in s,
            'STI GLB':'assets/2018_subaru_wrx_sti.glb' in s,
            'STI pending queue':'const pendingStiSedans=[];' in s,
            'STI install':'g.userData.stiVisual=true' in s,
            'Zombie cap':'MAX_ACTIVE_ZOMBIES=20' in s,
          }
          print(checks)
          assert all(checks.values())
          a=s.rfind('<script type="module">')
          a=s.find('>',a)+1
          b=s.find('</script>',a)
          Path('/tmp/game.mjs').write_text(s[a:b])
          PY
          node --check /tmp/game.mjs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser smoke, START, M4, STI
        run: |
          python3 -m http.server 4173 >/tmp/city-http.log 2>&1 &
          cat > /tmp/smoke.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
            const stiResponse=page.waitForResponse(r=>r.url().includes('2018_subaru_wrx_sti.glb') && r.status()===200,{timeout:15000});
            await page.goto('http://127.0.0.1:4173/?debug=1',{waitUntil:'networkidle'});
            await stiResponse;
            await page.locator('#start').click();
            await page.waitForTimeout(1200);
            const startDisplay=await page.locator('#startScreen').evaluate(el=>getComputedStyle(el).display);
            if(startDisplay!=='none') throw new Error('START OUTBREAK did not enter gameplay');
            if(await page.locator('text=GAME ERROR:').count()) throw new Error('runtime GAME ERROR shown');
            const before=(await page.locator('#ammo').textContent()).trim();
            if(!/^\d+\s*\/\s*\d+$/.test(before)) throw new Error('M4 ammo is not finite: '+before);
            await page.keyboard.press('KeyR');
            await page.waitForTimeout(50);
            if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
            const source=await page.locator('html').evaluate(()=>document.documentElement.innerHTML);
            if(!source.includes('pendingStiSedans')) throw new Error('STI integration missing from runtime source');
            console.log('SMOKE PASS', {startDisplay,before,stiLoaded:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/smoke.js
