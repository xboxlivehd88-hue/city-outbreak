name: Convert Postwar USDZ with Blender

on:
  push:
    paths:
      - '.github/workflows/postwar-usdz-convert.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Blender with USD support
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xz-utils
          curl -L --fail --retry 3 -o /tmp/blender.tar.xz "https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz"
          mkdir -p /tmp/blender-official
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender-official --strip-components=1
          /tmp/blender-official/blender --version | head -n 3
          /tmp/blender-official/blender --background --python-expr "import bpy; print('USD_IMPORT_AVAILABLE', hasattr(bpy.ops.wm, 'usd_import'))"

      - name: Unpack original USDZ
        run: |
          rm -rf /tmp/postwar_usdz
          mkdir -p /tmp/postwar_usdz
          unzip -q "assets/Postwar_City_-_Exterior_Scene.usdz" -d /tmp/postwar_usdz
          test -s /tmp/postwar_usdz/scene.usdc
          find /tmp/postwar_usdz -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          rm -rf assets/postwar_textures
          mkdir -p assets/postwar_textures
          cp -a /tmp/postwar_usdz/0/. assets/postwar_textures/

      - name: Import USD and export GLB
        run: |
          cat > /tmp/convert_postwar.py <<'PY'
          import bpy, json, os
          from mathutils import Vector

          src = "/tmp/postwar_usdz/scene.usdc"
          out = "/tmp/postwar_city_usdz_blender.glb"
          report_path = "/tmp/postwar_usdz_blender_report.json"

          bpy.ops.wm.read_factory_settings(use_empty=True)
          result = bpy.ops.wm.usd_import(
              filepath=src,
              import_cameras=False,
              import_lights=False,
              import_materials=True,
              import_meshes=True,
              import_curves=True,
              import_volumes=True,
              import_shapes=True,
              import_skeletons=True,
              import_blendshapes=True,
              import_visible_only=False,
              support_scene_instancing=True,
          )

          scene = bpy.context.scene
          meshes = [o for o in scene.objects if o.type == 'MESH']
          empties = [o for o in scene.objects if o.type == 'EMPTY']
          materials = list(bpy.data.materials)
          images = list(bpy.data.images)

          mins = Vector((1e30,1e30,1e30))
          maxs = Vector((-1e30,-1e30,-1e30))
          bounded = 0
          object_rows = []
          for obj in meshes:
              try:
                  corners = [obj.matrix_world @ Vector(c) for c in obj.bound_box]
                  omin = Vector((min(v[i] for v in corners) for i in range(3)))
                  omax = Vector((max(v[i] for v in corners) for i in range(3)))
                  for i in range(3):
                      mins[i] = min(mins[i], omin[i])
                      maxs[i] = max(maxs[i], omax[i])
                  bounded += 1
                  object_rows.append({
                      "name": obj.name,
                      "min": list(omin),
                      "max": list(omax),
                      "dimensions": list(omax-omin),
                      "materials": [s.material.name if s.material else None for s in obj.material_slots],
                  })
              except Exception as exc:
                  object_rows.append({"name": obj.name, "bounds_error": str(exc)})

          report = {
              "usd_import_result": list(result),
              "blender_version": bpy.app.version_string,
              "objects_total": len(scene.objects),
              "mesh_objects": len(meshes),
              "empty_objects": len(empties),
              "materials": len(materials),
              "images": len(images),
              "bounded_meshes": bounded,
              "bounds_min": list(mins) if bounded else None,
              "bounds_max": list(maxs) if bounded else None,
              "size": list(maxs-mins) if bounded else None,
              "objects": object_rows,
          }

          material_rows = []
          for mat in materials:
              row = {"name": mat.name, "images": []}
              if mat.use_nodes and mat.node_tree:
                  for node in mat.node_tree.nodes:
                      if node.type == 'TEX_IMAGE' and getattr(node, "image", None):
                          img = node.image
                          row["images"].append({
                              "name": img.name,
                              "filepath": bpy.path.abspath(img.filepath),
                          })
              material_rows.append(row)
          report["material_rows"] = material_rows

          with open(report_path, "w") as f:
              json.dump(report, f, indent=2)

          print("POSTWAR_MESH_ROWS", json.dumps(object_rows, indent=2))
          print("POSTWAR_MATERIAL_ROWS", json.dumps(material_rows, indent=2))

          bpy.ops.export_scene.gltf(
              filepath=out,
              export_format='GLB',
              use_selection=False,
              export_cameras=False,
              export_lights=False,
              export_apply=True,
          )

          if not os.path.exists(out) or os.path.getsize(out) < 1000000:
              raise RuntimeError("Generated GLB is missing or unexpectedly small")
          print("POSTWAR_REPORT", json.dumps({k:v for k,v in report.items() if k!="objects"}, indent=2))
          print("POSTWAR_GLB_BYTES", os.path.getsize(out))
          PY

          /tmp/blender-official/blender --background --python /tmp/convert_postwar.py
          ls -lh /tmp/postwar_city_usdz_blender.glb
          cp /tmp/postwar_city_usdz_blender.glb assets/postwar_city_usdz_blender.glb
          cp /tmp/postwar_usdz_blender_report.json /tmp/postwar_usdz_blender_report.saved.json

      - name: Commit generated GLB
        run: |
          test -s assets/postwar_city_usdz_blender.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/postwar_city_usdz_blender.glb assets/postwar_textures
          if ! git diff --cached --quiet; then
            git commit -m "Generate Postwar City GLB from original USDZ [skip ci]"
            git push
          else
            echo "Generated GLB is unchanged"
          fi
