name: CITY OUTBREAK v148 remove health drops
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "57471db7a250c17c9e337f383cd4807a6ea02ef2"
      - name: Apply v148 patch
        run: python3 .github/city-outbreak-v148-remove-health-drops.py
      - name: Validate JavaScript and drop system
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v148.js").write_text(inline,encoding="utf-8")
          assert 'const type=rnd()<.625?"ammo":"money"' in inline
          assert 'health:new THREE.BoxGeometry' not in inline
          assert 'health:new THREE.MeshStandardMaterial' not in inline
          assert 'spawnFixedDrop(pos,"health"' not in inline
          assert 'd.type==="health"' not in inline
          assert 'medkit(-10,8);medkit(16,56);medkit(-17,91);' in inline
          assert 'PLAYER_HEALTH_REGEN_DELAY=5,PLAYER_HEALTH_REGEN_RATE=10' in inline
          PY
          node --check /tmp/city-outbreak-v148.js
          git diff --check
      - name: Commit v148
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove physical health drops v148"
          git push origin HEAD:main
