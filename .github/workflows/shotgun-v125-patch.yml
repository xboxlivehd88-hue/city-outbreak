name: CITY OUTBREAK v125 shotgun patch

on:
  push:
    paths:
      - ".github/workflows/shotgun-v125-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate shotgun patch
        run: python3 .github/shotgun-v125-patch.py
      - name: Validate diff
        run: git diff --check
      - name: Commit gameplay change
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shotgun shell-by-shell reload v125"
          git push origin HEAD:main
