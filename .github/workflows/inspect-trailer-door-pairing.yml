name: Inspect Trailer Door Pairing

on:
  push:
    paths:
      - '.github/workflows/inspect-trailer-door-pairing.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pair exterior doors to trailer shells
        run: |
          python3 - <<'PY'
          import json,struct,math,re
          with open('assets/trailer_park.glb','rb') as f:
              f.read(12);n,typ=struct.unpack('<II',f.read(8));g=json.loads(f.read(n).decode('utf-8').rstrip('\x00 '))
          nodes=g.get('nodes',[]);meshes=g.get('meshes',[]);acc=g.get('accessors',[])
          parents=[None]*len(nodes)
          for i,n in enumerate(nodes):
              for ch in n.get('children',[]):parents[ch]=i
          def mm(a,b):return [[sum(a[r][k]*b[k][c] for k in range(4)) for c in range(4)] for r in range(4)]
          def loc(n):
              if 'matrix'in n:
                  m=n['matrix'];return [[m[c*4+r] for c in range(4)] for r in range(4)]
              t=n.get('translation',[0,0,0]);s=n.get('scale',[1,1,1]);q=n.get('rotation',[0,0,0,1]);x,y,z,w=q
              R=[[1-2*y*y-2*z*z,2*x*y-2*z*w,2*x*z+2*y*w,0],[2*x*y+2*z*w,1-2*x*x-2*z*z,2*y*z-2*x*w,0],[2*x*z-2*y*w,2*y*z+2*x*w,1-2*x*x-2*y*y,0],[0,0,0,1]]
              S=[[s[0],0,0,0],[0,s[1],0,0],[0,0,s[2],0],[0,0,0,1]];M=mm(R,S);M[0][3]=t[0];M[1][3]=t[1];M[2][3]=t[2];return M
          cache={}
          def world(i):
              if i in cache:return cache[i]
              m=loc(nodes[i]);p=parents[i];cache[i]=m if p is None else mm(world(p),m);return cache[i]
          def tx(M,p):
              x,y,z=p;return(M[0][0]*x+M[0][1]*y+M[0][2]*z+M[0][3],M[1][0]*x+M[1][1]*y+M[1][2]*z+M[1][3],M[2][0]*x+M[2][1]*y+M[2][2]*z+M[2][3])
          def mb(mi):
              lo=[1e9]*3;hi=[-1e9]*3;ok=False
              for pr in meshes[mi].get('primitives',[]):
                  ai=pr.get('attributes',{}).get('POSITION')
                  if ai is None:continue
                  a=acc[ai]
                  if 'min'not in a:continue
                  ok=True
                  for k in range(3):lo[k]=min(lo[k],a['min'][k]);hi[k]=max(hi[k],a['max'][k])
              return(lo,hi)if ok else None
          rows=[]
          for i,n in enumerate(nodes):
              mi=n.get('mesh')
              if mi is None:continue
              b=mb(mi)
              if not b:continue
              lo,hi=b;M=world(i);pts=[tx(M,(x,y,z)) for x in(lo[0],hi[0]) for y in(lo[1],hi[1]) for z in(lo[2],hi[2])]
              mn=[min(p[k] for p in pts) for k in range(3)];mx=[max(p[k] for p in pts) for k in range(3)]
              mn=[mn[0]*1.25,mn[1]*1.25+.97,mn[2]*1.25];mx=[mx[0]*1.25,mx[1]*1.25+.97,mx[2]*1.25]
              name=n.get('name')or meshes[mi].get('name')or''
              rows.append((name,mn,mx))
          doors=[]
          for name,mn,mx in rows:
              if re.match(r'^Door(?:\.\d+)?_Door_0$',name,re.I):
                  doors.append((name,((mn[0]+mx[0])/2,(mn[2]+mx[2])/2),mn,mx))
          homes={}
          for name,mn,mx in rows:
              m=re.match(r'^(Home(?:_\d+)?)(?:[._]|$)',name,re.I)
              if not m or 'metalplates' not in name.lower():continue
              key=m.group(1).lower()
              if key not in homes:homes[key]=[mn[:],mx[:]]
              else:
                  for k in range(3):homes[key][0][k]=min(homes[key][0][k],mn[k]);homes[key][1][k]=max(homes[key][1][k],mx[k])
          for key,(mn,mx) in sorted(homes.items()):
              hc=((mn[0]+mx[0])/2,(mn[2]+mx[2])/2)
              ranked=sorted((math.hypot(dc[0]-hc[0],dc[1]-hc[1]),dn,dc)for dn,dc,_,_ in doors)
              d,dn,dc=ranked[0]
              side=min([('minX',abs(dc[0]-mn[0])),('maxX',abs(dc[0]-mx[0])),('minZ',abs(dc[1]-mn[2])),('maxZ',abs(dc[1]-mx[2]))],key=lambda x:x[1])
              print(key,'homeCenter=',tuple(round(v,3)for v in hc),'bounds=',round(mn[0],3),round(mx[0],3),round(mn[2],3),round(mx[2],3),'->',dn,'door=',tuple(round(v,3)for v in dc),'dist=',round(d,3),'side=',side)
          PY
