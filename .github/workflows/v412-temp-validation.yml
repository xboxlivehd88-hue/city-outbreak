name: v412 temporary validation
on:
  push:
    paths:
      - '.github/workflows/v412-temp-validation.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v412
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=412' index.html
          grep -Fq 'PhotoMatchedHouseGapFence_v412' src/game.js
          grep -Fq 'targetLong=1.72' src/game.js
          grep -Fq -- '-9.64-(1.58*.15)' src/game.js
          grep -Fq 'source:"v412PhotoGapFence"' src/game.js
          grep -Fq 'const copyRagdollArm=(dst,key,zBias)=>' src/game.js
          grep -Fq 'const supportLua=rigBone(z,"L_UpperArm")' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
