name: CITY OUTBREAK v147 shambler master model
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "e2003e8b5ca30f809a363cbeb0ddedaee0c41773"
      - name: Apply v147 patch
        run: python3 .github/city-outbreak-v147-shambler-master.py
      - name: Validate JavaScript and inheritance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v147.js").write_text(inline,encoding="utf-8")
          assert 'const SHAMBLER_RIG_PROFILE=Object.freeze({' in inline
          assert 'sprinter:derivedRigProfile()' in inline
          assert 'radiated:derivedRigProfile()' in inline
          assert 'infected:derivedRigProfile()' in inline
          assert 'acidic:derivedRigProfile()' in inline
          assert 'const rig=cloneShamblerRig();' in inline
          assert 'applyZombieRigProfile(rig,kind)' in inline
          assert 'z.visualBaseKind="shambler"' in inline
          PY
          node --check /tmp/city-outbreak-v147.js
          git diff --check
      - name: Commit v147
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Shambler the shared zombie visual baseline v147"
          git push origin HEAD:main
