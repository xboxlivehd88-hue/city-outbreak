name: v400 temporary validation
on:
  push:
    paths:
      - '.github/workflows/v400-temp-validation.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v400
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=400' index.html
          grep -Fq 'walkers.glb now follows the real approved Shambler skeleton' src/game.js
          grep -Fq 'walkerRigLinks' src/game.js
          grep -Fq 'l.key==="Hips"' src/game.js
          grep -Fq '(z.radiatedGreenVisual||z.walkerVisual)?radiatedSpinTopTarget(z):null' src/game.js
          grep -Fq 'lua=bone("L_UpperArm",-h*.15,-h*.04,0)' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
