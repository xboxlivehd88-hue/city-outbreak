name: Windows dependency lockfile preparation
on:
  push:
    branches:
      - toby/windows-lockfile-security
    paths:
      - '.github/workflows/windows-lockfile-prep.yml'
      - 'desktop/package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-lockfile:
    name: Generate and verify npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate deterministic dependency resolution metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check npm lockfile and reproducible install
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.lockfileVersion!==3 || l.packages[''].version!==p.version)process.exit(1)"
      - name: Upload proposed lockfile for review (no repository writes)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proposed-desktop-package-lock
          path: desktop/package-lock.json
          if-no-files-found: error
          retention-days: 7
