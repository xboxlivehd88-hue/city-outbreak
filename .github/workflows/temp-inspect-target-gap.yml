name: inspect target house gap
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-target-gap.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect object bounds
        run: |
          python3 - <<'PY'
          import json,struct,re,math
          from pathlib import Path
          b=Path('assets/chicken_gun_fruzer_-_city.glb').read_bytes()
          pos=12;n,t=struct.unpack_from('<II',b,pos);pos+=8
          g=json.loads(b[pos:pos+n].decode('utf-8').rstrip('\x00 '));pos+=n
          while pos%4:pos+=1
          bl,bt=struct.unpack_from('<II',b,pos);pos+=8;blob=b[pos:pos+bl]
          nodes=g['nodes'];parents={}
          for i,node in enumerate(nodes):
            for ch in node.get('children',[]):parents[ch]=i
          cts={5120:'b',5121:'B',5122:'h',5123:'H',5125:'I',5126:'f'};cs={5120:1,5121:1,5122:2,5123:2,5125:4,5126:4};comps={'SCALAR':1,'VEC2':2,'VEC3':3,'VEC4':4,'MAT4':16}
          def acc(ai):
            a=g['accessors'][ai];bv=g['bufferViews'][a['bufferView']];ct=a['componentType'];nc=comps[a['type']];fmt='<'+cts[ct]*nc;stride=bv.get('byteStride',cs[ct]*nc);off=bv.get('byteOffset',0)+a.get('byteOffset',0)
            return [struct.unpack_from(fmt,blob,off+i*stride) for i in range(a['count'])]
          def mm(a,b):
            r=[0.0]*16
            for c in range(4):
              for row in range(4):r[c*4+row]=sum(a[k*4+row]*b[c*4+k] for k in range(4))
            return r
          def trs(n):
            if 'matrix' in n:return n['matrix']
            t=n.get('translation',[0,0,0]);s=n.get('scale',[1,1,1]);q=n.get('rotation',[0,0,0,1]);x,y,z,w=q
            r=[1-2*y*y-2*z*z,2*x*y+2*w*z,2*x*z-2*w*y,0,2*x*y-2*w*z,1-2*x*x-2*z*z,2*y*z+2*w*x,0,2*x*z+2*w*y,2*y*z-2*w*x,1-2*x*x-2*y*y,0,0,0,0,1]
            r[0]*=s[0];r[1]*=s[0];r[2]*=s[0];r[4]*=s[1];r[5]*=s[1];r[6]*=s[1];r[8]*=s[2];r[9]*=s[2];r[10]*=s[2];r[12],r[13],r[14]=t
            return r
          world={}
          def wm(i):
            if i in world:return world[i]
            m=trs(nodes[i]);p=parents.get(i);world[i]=mm(wm(p),m) if p is not None else m;return world[i]
          def tp(m,p):
            x,y,z=p;return(m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14])
          def descendants(root):
            out=[];stack=[root]
            while stack:
              i=stack.pop();out.append(i);stack.extend(nodes[i].get('children',[]))
            return out
          cache={}
          def bbox(root):
            if root in cache:return cache[root]
            pts=[]
            for i in descendants(root):
              mi=nodes[i].get('mesh')
              if mi is None:continue
              M=wm(i)
              for pr in g['meshes'][mi].get('primitives',[]):
                pa=pr.get('attributes',{}).get('POSITION')
                if pa is not None:pts.extend(tp(M,p) for p in acc(pa))
            if not pts:return None
            xs=[p[0] for p in pts];ys=[p[1] for p in pts];zs=[p[2] for p in pts]
            bb=(min(xs),max(xs),min(ys),max(ys),min(zs),max(zs));cache[root]=bb;return bb
          def gamebb(bb):
            minx,maxx,miny,maxy,minz,maxz=bb
            return (21.33575+minx*1.55,21.33575+maxx*1.55,28.68275+miny*1.55,28.68275+maxy*1.55,8.25+minz*1.55,8.25+maxz*1.55)
          objs=[]
          pat=re.compile(r'House_|Fence_01|Building|Office|Tower|Skyscraper|Apartment|Hotel|Shop|Store|Mall|Bank|Garage',re.I)
          for i,nod in enumerate(nodes):
            name=nod.get('name','')
            if not pat.search(name) or 'LowPolyFPS' in name:continue
            bb=bbox(i)
            if not bb:continue
            gb=gamebb(bb);cx=(gb[0]+gb[1])/2;cz=(gb[4]+gb[5])/2
            objs.append((i,name,gb,cx,cz))
          candidates=[(-47.11,-28.84),(-29.14,27.65),(-19.97,7.05)]
          for cx,cz in candidates:
            print('=== CANDIDATE',cx,cz,'===')
            rows=[]
            for i,name,gb,ox,oz in objs:
              d=math.hypot(ox-cx,oz-cz)
              if d<28:rows.append((d,i,name,gb))
            for d,i,name,gb in sorted(rows)[:60]:
              print(round(d,2),i,name,'BBOX',tuple(round(v,2) for v in (gb[0],gb[1],gb[4],gb[5])))
          print('=== HOUSE X-GAPS ===')
          houses=[o for o in objs if o[1].startswith('House_')]
          for ai,a in enumerate(houses):
            for b in houses[ai+1:]:
              ia,na,ga,acx,acz=a;ib,nb,gb,bcx,bcz=b
              ax0,ax1,az0,az1=ga[0],ga[1],ga[4],ga[5]
              bx0,bx1,bz0,bz1=gb[0],gb[1],gb[4],gb[5]
              zov=max(0,min(az1,bz1)-max(az0,bz0))
              if zov<5:continue
              if ax1<=bx0:gap=bx0-ax1;mid=(ax1+bx0)/2
              elif bx1<=ax0:gap=ax0-bx1;mid=(bx1+ax0)/2
              else:continue
              if gap<=3.0:
                midz=(max(az0,bz0)+min(az1,bz1))/2
                print('XGAP',round(gap,3),'MID',round(mid,3),round(midz,3),ia,na,tuple(round(v,2) for v in (ax0,ax1,az0,az1)),ib,nb,tuple(round(v,2) for v in (bx0,bx1,bz0,bz1)))
          print('=== OBJECTS NEAR MATCHED BROWN-GRAY GAP ===')
          tx,tz=-18.018,22.469
          rows=[]
          for i,nod in enumerate(nodes):
            name=nod.get('name','')
            if not name or 'LowPolyFPS' in name:continue
            bb=bbox(i)
            if not bb:continue
            gb=gamebb(bb);w=gb[1]-gb[0];dpth=gb[5]-gb[4]
            if w<3 or dpth<3:continue
            cx=(gb[0]+gb[1])/2;cz=(gb[4]+gb[5])/2
            dist=math.hypot(cx-tx,cz-tz)
            if dist<32:rows.append((dist,i,name,gb))
          for dist,i,name,gb in sorted(rows)[:80]:
            print(round(dist,2),i,name,'BBOX',tuple(round(v,2) for v in (gb[0],gb[1],gb[4],gb[5])))
          print('=== FENCES ===')
          for i,name,gb,cx,cz in objs:
            if name.startswith('Fence_01'):
              print(i,name,'BBOX',tuple(round(v,3) for v in (gb[0],gb[1],gb[2],gb[3],gb[4],gb[5])))
          PY
