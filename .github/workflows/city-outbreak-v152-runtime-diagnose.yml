name: CITY OUTBREAK v152 runtime diagnose
on: [push]
jobs:
  runtime-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify v151 source under test
        run: test "$(git hash-object index.html)" = "b5e8f1007985f639a03a6baaa4e775cb0a95dcaf"
      - name: Install browser driver
        run: python3 -m pip install --quiet selenium
      - name: Start local server
        run: |
          python3 -m http.server 8000 >/tmp/city-http.log 2>&1 &
          sleep 2
      - name: Exercise start button
        run: |
          python3 - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          o=Options()
          o.add_argument("--headless=new")
          o.add_argument("--no-sandbox")
          o.add_argument("--disable-dev-shm-usage")
          o.add_argument("--disable-gpu")
          o.set_capability("goog:loggingPrefs",{"browser":"ALL"})
          d=webdriver.Chrome(options=o)
          try:
              d.get("http://127.0.0.1:8000/?v=151")
              time.sleep(4)
              before=d.execute_script("return {ready:document.readyState,start:!!document.getElementById('start'),screen:document.getElementById('startScreen')?.className||'',display:getComputedStyle(document.getElementById('startScreen')).display}")
              print("BEFORE",json.dumps(before))
              logs=d.get_log("browser")
              for x in logs: print("CONSOLE_BEFORE",x["level"],x["message"])
              btn=WebDriverWait(d,8).until(EC.element_to_be_clickable((By.ID,"start")))
              btn.click()
              time.sleep(2)
              after=d.execute_script("return {screen:document.getElementById('startScreen')?.className||'',display:getComputedStyle(document.getElementById('startScreen')).display,wave:document.getElementById('wave')?.textContent||'',hud:document.getElementById('hud')?.style.display||''}")
              print("AFTER",json.dumps(after))
              logs=d.get_log("browser")
              for x in logs: print("CONSOLE_AFTER",x["level"],x["message"])
              if after["display"]!="none":
                  raise SystemExit("START_TEST_FAILED: start screen still visible after click")
          finally:
              d.quit()
          PY
