name: One-shot boss explosive collision patch

on:
  push:
    paths:
      - '.github/workflows/patch-boss.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply boss patch
        run: python3 .github/patch_boss.py
      - name: Commit boss fix
        run: |
          git config user.name "city-outbreak-bot"
          git config user.email "city-outbreak-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Fix boss chest explosive collision and flinch"
          git push origin main
