name: v658 Hazmat and Green Guy regression
on:
  push:
    paths:
      - 'src/game.js'
      - 'src/hazmat-zombie.js'
      - 'scripts/hazmat-v599-smoke.cjs'
      - '.github/workflows/hazmat-v599-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hazmat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for real gameplay
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify original Hazmat GLB, joints, textures, acidic Wave 1
        run: |
          python3 -m http.server 4173 >/tmp/hazmat-server.log 2>&1 &
          sleep 2
          node scripts/hazmat-v599-smoke.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hazmat-v658-audit
          path: HAZMAT_V658_AUDIT.json
