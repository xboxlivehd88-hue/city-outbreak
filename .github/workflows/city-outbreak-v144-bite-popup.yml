name: CITY OUTBREAK v144 bite damage popup
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "3ca5d1372180cc2008a74e4d17f40adef579193a"
      - name: Apply v144 patch
        run: python3 .github/city-outbreak-v144-bite-popup.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v144.js").write_text(inline,encoding="utf-8")
          assert 'dealt=z.damage*(1-armPenalty)' in inline
          assert 'Math.round(dealt*10)/10' in inline
          PY
          node --check /tmp/city-outbreak-v144.js
          git diff --check
      - name: Commit v144
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show actual reduced zombie bite damage v144"
          git push origin HEAD:main
