name: M17 GLB original anatomy audit
on:
  push:
    paths:
      - 'scripts/m17-source-anatomy.cjs'
      - '.github/workflows/m17-source-anatomy.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect original skinned source asset
        run: node scripts/m17-source-anatomy.cjs
