name: v397 temporary validation
on:
  push:
    paths:
      - '.github/workflows/v397-temp-validation.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v397
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=397' index.html
          grep -Fq 'function radiatedSpinTopTarget(z)' src/game.js
          grep -Fq 'g.launcher||!g.bottomYPivot' src/game.js
          grep -Fq 'function updateZombieRoute(z,dt,huntMode,goalX=px,goalZ=pz)' src/game.js
          grep -Fq 'crawler pulls itself forward with alternating arms' src/game.js
          grep -Fq 'z.crawlerHitboxes=z.hitMeshes?z.hitMeshes.slice():[]' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
