name: One-shot magazine swap reload patch

on:
  push:
    paths:
      - '.github/workflows/patch-mag-swap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply magazine swap reload patch
        run: python3 .github/patch_mag_swap.py
      - name: Commit gameplay update
        run: |
          git config user.name 'city-outbreak-bot'
          git config user.email 'city-outbreak-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Animate discarded and fresh magazines during reloads'
          git push origin main
