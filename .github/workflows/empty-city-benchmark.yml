name: v781 Render Isolation Playwright
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'tests/visual/empty-city-benchmark.test.mjs'
      - 'tests/visual/v780-comparison.test.mjs'
      - 'tests/visual/v781-effects-zombies.test.mjs'
      - '.github/workflows/empty-city-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  empty-city-playwright:
    name: City render, collision and environment Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check game module syntax
        run: node --check src/game.js
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the exact pull request code
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/city-http.log 2>&1 &
      - name: Run original empty-city regression
        env:
          CITY_TEST_URL: http://127.0.0.1:8765
        run: node --test tests/visual/empty-city-benchmark.test.mjs
      - name: Compare v780 collision and environment in Chromium
        env:
          CITY_TEST_URL: http://127.0.0.1:8765
        run: node --test tests/visual/v780-comparison.test.mjs
      - name: Verify rain lights and stationary models
        env:
          CITY_TEST_URL: http://127.0.0.1:8765
        run: node --test tests/visual/v781-effects-zombies.test.mjs
      - name: Upload diagnostic screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: city-benchmark-v781-${{ github.run_number }}
          path: |
            test-results/empty-city/
            test-results/v780-comparison/
            test-results/v781-effects-zombies/
          if-no-files-found: warn
          retention-days: 14
