name: CITY OUTBREAK v137 rounded walkers
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "05e3b9267bbc41416bc2256b3e76fa826bcd2a4c"
      - name: Apply v137 patch
        run: python3 .github/city-outbreak-v137-rounded-walkers.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v137.js").write_text(inline,encoding="utf-8")
          PY
          node --check /tmp/city-outbreak-v137.js
          git diff --check
      - name: Commit v137
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Round walker geometry and soften faces v137"
          git push origin HEAD:main
