name: Panzer GLB anatomy audit
on:
  push:
    paths:
      - '.github/workflows/panzer-anatomy-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actual model
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Examine GLB nodes and vertex weights
        run: python3 scripts/panzer_model_audit.py
      - name: Commit readable audit report
        run: |
          git config user.name "city-outbreak-audit[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PANZER_MODEL_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "diagnostics: actual Panzer GLB bones and skin weights"
            git push origin HEAD:main
          fi
