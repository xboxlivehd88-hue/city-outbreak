name: Inspect New City Navigation Surfaces

on:
  push:
    paths:
      - '.github/workflows/inspect-city-nav-surfaces.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect named city meshes
        run: |
          python3 - <<'PY'
          import json,struct,re,math
          p='assets/chicken_gun_fruzer_-_city.glb'
          data=open(p,'rb').read()
          off=12;g=None
          while off+8<=len(data):
              n,t=struct.unpack_from('<II',data,off);off+=8
              chunk=data[off:off+n];off+=n
              if t==0x4E4F534A:g=json.loads(chunk.decode('utf-8').rstrip('\x00 \t\r\n'))
          nodes=g.get('nodes',[]);meshes=g.get('meshes',[]);acc=g.get('accessors',[])
          parents=[None]*len(nodes)
          for i,node in enumerate(nodes):
              for ch in node.get('children',[]): parents[ch]=i
          def mm(a,b): return [[sum(a[r][k]*b[k][c] for k in range(4)) for c in range(4)] for r in range(4)]
          def local(node):
              if 'matrix' in node:
                  m=node['matrix'];return [[m[c*4+r] for c in range(4)] for r in range(4)]
              t=node.get('translation',[0,0,0]);s=node.get('scale',[1,1,1]);q=node.get('rotation',[0,0,0,1]);x,y,z,w=q
              R=[[1-2*y*y-2*z*z,2*x*y-2*z*w,2*x*z+2*y*w,0],
                 [2*x*y+2*z*w,1-2*x*x-2*z*z,2*y*z-2*x*w,0],
                 [2*x*z-2*y*w,2*y*z+2*x*w,1-2*x*x-2*y*y,0],[0,0,0,1]]
              S=[[s[0],0,0,0],[0,s[1],0,0],[0,0,s[2],0],[0,0,0,1]]
              M=mm(R,S);M[0][3]=t[0];M[1][3]=t[1];M[2][3]=t[2];return M
          cache={}
          def world(i):
              if i in cache:return cache[i]
              M=local(nodes[i]);pa=parents[i];cache[i]=M if pa is None else mm(world(pa),M);return cache[i]
          def tx(M,p):
              x,y,z=p
              return (M[0][0]*x+M[0][1]*y+M[0][2]*z+M[0][3],
                      M[1][0]*x+M[1][1]*y+M[1][2]*z+M[1][3],
                      M[2][0]*x+M[2][1]*y+M[2][2]*z+M[2][3])
          def mb(mi):
              lo=[1e30]*3;hi=[-1e30]*3;ok=False
              for pr in meshes[mi].get('primitives',[]):
                  ai=pr.get('attributes',{}).get('POSITION')
                  if ai is None:continue
                  a=acc[ai]
                  if 'min' not in a or 'max' not in a:continue
                  ok=True
                  for k in range(3):lo[k]=min(lo[k],a['min'][k]);hi[k]=max(hi[k],a['max'][k])
              return (lo,hi) if ok else None
          pats={
            'STAIR':re.compile(r'stair|step',re.I),
            'WALKABLE':re.compile(r'road|street|sidewalk|pavement|ground|bg_|path|walk',re.I),
            'BUILDING':re.compile(r'house|building|shop|store|garage|apartment|hotel|office|wall',re.I),
            'DOOR':re.compile(r'door|entrance|gate',re.I)
          }
          out={k:[] for k in pats}
          for i,n in enumerate(nodes):
              mi=n.get('mesh')
              if mi is None:continue
              name=n.get('name') or meshes[mi].get('name') or f'node_{i}'
              full=name
              pi=parents[i]; chain=[]
              while pi is not None and len(chain)<4:
                  chain.append(nodes[pi].get('name',''));pi=parents[pi]
              full+=' | '+' > '.join(chain)
              for label,pat in pats.items():
                  if not pat.search(full):continue
                  b=mb(mi)
                  if not b:continue
                  lo,hi=b;M=world(i)
                  pts=[tx(M,(x,y,z)) for x in (lo[0],hi[0]) for y in (lo[1],hi[1]) for z in (lo[2],hi[2])]
                  mn=[min(p[k] for p in pts) for k in range(3)];mx=[max(p[k] for p in pts) for k in range(3)]
                  out[label].append((i,name,tuple(chain),tuple(round((mn[k]+mx[k])/2,3) for k in range(3)),tuple(round(mx[k]-mn[k],3) for k in range(3))))
          for label,items in out.items():
              print('===',label,len(items),'===')
              for x in items[:250]:print(x)
          PY
