name: v407 temporary validation
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-atm-alley.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v407
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=407' index.html
          grep -Fq 'function addAtmAlleyFenceExtension(map)' src/game.js
          grep -Fq 'source:"v407AtmAlleyFence"' src/game.js
          grep -Fq 'ATMAlleyFence_A' src/game.js
          grep -Fq 'ATMAlleyFence_B' src/game.js
          grep -Fq 'ATMAlleyFence_C' src/game.js
          ! grep -Fq 'addWestBoundaryHouseGapFences' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
