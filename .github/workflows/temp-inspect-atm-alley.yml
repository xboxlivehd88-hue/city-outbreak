name: inspect ATM neighborhoods
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-atm-alley.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print nearby named anchors
        run: |
          python3 - <<'PY'
          import json,struct,re,math
          from pathlib import Path
          b=Path('assets/chicken_gun_fruzer_-_city.glb').read_bytes()
          n,t=struct.unpack_from('<II',b,12)
          g=json.loads(b[20:20+n].decode('utf-8').rstrip('\x00 '))
          nodes=g.get('nodes',[]);parents={}
          for i,node in enumerate(nodes):
            for ch in node.get('children',[]):parents[ch]=i
          def mm(a,b):
            r=[0.0]*16
            for c in range(4):
              for row in range(4):r[c*4+row]=sum(a[k*4+row]*b[c*4+k] for k in range(4))
            return r
          def trs(n):
            if 'matrix' in n:return n['matrix']
            t=n.get('translation',[0,0,0]);s=n.get('scale',[1,1,1]);q=n.get('rotation',[0,0,0,1]);x,y,z,w=q
            r=[1-2*y*y-2*z*z,2*x*y+2*w*z,2*x*z-2*w*y,0,2*x*y-2*w*z,1-2*x*x-2*z*z,2*y*z+2*w*x,0,2*x*z+2*w*y,2*y*z-2*w*x,1-2*x*x-2*y*y,0,0,0,0,1]
            r[0]*=s[0];r[1]*=s[0];r[2]*=s[0];r[4]*=s[1];r[5]*=s[1];r[6]*=s[1];r[8]*=s[2];r[9]*=s[2];r[10]*=s[2];r[12],r[13],r[14]=t
            return r
          world={}
          def wm(i):
            if i in world:return world[i]
            m=trs(nodes[i]);p=parents.get(i);world[i]=mm(wm(p),m) if p is not None else m;return world[i]
          pos=[]
          for i,n in enumerate(nodes):
            m=wm(i);gx=21.33575+m[12]*1.55;gy=28.68275+m[13]*1.55;gz=8.25+m[14]*1.55
            pos.append((gx,gy,gz))
          atms=[389,391,698]
          for ai in atms:
            ax,ay,az=pos[ai]
            print('=== ATM',ai,nodes[ai].get('name',''),'AT',round(ax,2),round(az,2),'===')
            rows=[]
            for i,n in enumerate(nodes):
              name=n.get('name','')
              if not name or i==ai:continue
              # object anchors only: skip LowPoly child meshes
              if 'LowPolyFPS' in name:continue
              gx,gy,gz=pos[i];d=math.hypot(gx-ax,gz-az)
              if d<=22:
                rows.append((d,i,name,gx,gz,n.get('mesh'),n.get('children')))
            for d,i,name,gx,gz,mesh,ch in sorted(rows)[:90]:
              print(round(d,2),i,name,'GAME',round(gx,2),round(gz,2),'mesh',mesh,'children',ch)
          PY
