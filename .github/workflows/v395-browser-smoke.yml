name: v395 browser smoke
on:
  push:
    paths:
      - '.github/workflows/v395-browser-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Runtime smoke
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          cat >/tmp/smoke.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            const errs=[],logs=[];
            p.on('pageerror',e=>errs.push(String(e)));
            p.on('console',m=>logs.push(m.text()));
            await p.goto('http://127.0.0.1:4173/?v=395-smoke',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.querySelector('#start'),null,{timeout:30000});
            await p.waitForTimeout(8000);
            const loaded=logs.some(x=>x.includes('green guy radiated model loaded'));
            if(!loaded)throw Error('green guy GLB/autorig did not finish loading');
            if(errs.length)throw Error(errs.join(' | '));
            await p.locator('#start').click();
            await p.waitForTimeout(1500);
            if(await p.locator('#startScreen').evaluate(e=>getComputedStyle(e).display)!=='none')throw Error('START failed');
            if(errs.length)throw Error(errs.join(' | '));
            console.log('PASS v395 runtime smoke');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/smoke.cjs
