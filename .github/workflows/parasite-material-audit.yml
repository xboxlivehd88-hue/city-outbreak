name: Parasite original GLB material audit
on:
  push:
    paths:
      - scripts/parasite-original-material-audit.cjs
      - .github/workflows/parasite-material-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect actual uploaded GLB material, texture and color attributes
        run: node scripts/parasite-original-material-audit.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: parasite-original-material-audit
          path: PARASITE_ORIGINAL_MATERIAL_AUDIT.json
