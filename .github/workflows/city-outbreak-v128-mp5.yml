name: CITY OUTBREAK v128 MP5
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "797a73c3922d0a22067905753dd98c1b5161d295"
      - name: Apply MP5 patch
        run: python3 .github/city-outbreak-v128-mp5.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          inline = max(scripts, key=len)
          Path("/tmp/city-outbreak-v128.js").write_text(inline, encoding="utf-8")
          PY
          node --check /tmp/city-outbreak-v128.js
          git diff --check
      - name: Commit v128
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign SMG as MP5 v128"
          git push origin HEAD:main
