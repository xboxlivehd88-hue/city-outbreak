name: v181 fast browser smoke
on:
  push:
    paths:
      - '.github/workflows/v181-fast-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y >/dev/null 2>&1 && npm i playwright-core@1.55.0 >/dev/null 2>&1
      - name: Headless Chrome START and assets
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
            const page=await browser.newPage();
            const errors=[]; const glb=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.url().includes('.glb'))glb.push([r.url(),r.status()]);});
            await page.goto('http://127.0.0.1:4173/?debug=1',{waitUntil:'networkidle'});
            await page.waitForTimeout(1000);
            if(!glb.some(x=>x[0].includes('2018_subaru_wrx_sti.glb')&&x[1]===200))throw Error('STI GLB missing');
            if(!glb.some(x=>x[0].includes('classic_m4.glb.glb')&&x[1]===200))throw Error('M4 GLB missing');
            await page.locator('#start').click(); await page.waitForTimeout(900);
            if(await page.locator('#startScreen').evaluate(e=>getComputedStyle(e).display)!=='none')throw Error('START failed');
            const ammo=(await page.locator('#ammo').textContent()).trim();
            if(!/^\d+\s*\/\s*\d+$/.test(ammo))throw Error('M4 ammo not finite '+ammo);
            if(errors.length)throw Error(errors.join(' | '));
            console.log('PASS',ammo);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
