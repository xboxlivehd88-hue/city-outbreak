name: v398 temporary validation
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-zombie-glbs.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v398
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=398' index.html
          grep -Fq 'lua=bone("L_UpperArm",-h*.15,-h*.04,0)' src/game.js
          grep -Fq 'y>h*.56&&y<h*.70&&ax>h*.13' src/game.js
          grep -Fq 'new THREE.BoxGeometry(.44,.24,.28)' src/game.js
          grep -Fq 'function radiatedSpinTopTarget(z)' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
