name: v399 temporary validation
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-zombie-glbs.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v399
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=399' index.html
          grep -Fq 'assets/walkers.glb?v=399' src/game.js
          grep -Fq 'function buildBasicWalkerTemplate(source)' src/game.js
          grep -Fq 'function buildBasicWalkerHitboxes(z)' src/game.js
          grep -Fq 'if(kind==="shambler")attachBasicWalkerVisual(zz,g);' src/game.js
          grep -Fq '(z.radiatedGreenVisual||z.walkerVisual)?radiatedSpinTopTarget(z):null' src/game.js
          grep -Fq 'lua=bone("L_UpperArm",-h*.15,-h*.04,0)' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
