name: CITY OUTBREAK v149 crawler baseline
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "c8aa30c5e3f9e83c54f951f1464053f8034b9c98"
      - name: Apply v149 patch
        run: python3 .github/city-outbreak-v149-crawler-baseline.py
      - name: Validate JavaScript and crawler pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v149.js").write_text(inline,encoding="utf-8")
          assert 'const CRAWLER_MOUTH_GORE_GEO=mergeZombieDetail([' in inline
          assert 'const CRAWLER_BODY_GORE_GEO=mergeZombieDetail([' in inline
          assert 'mouth.geometry=new THREE.BoxGeometry(.094,.024,.014)' in inline
          assert 'crawlerMouthGore.name="CrawlerMouthBlood"' in inline
          assert 'crawlerBodyGore.name="CrawlerBodyBlood"' in inline
          assert 'crawlerArmGore.name="CrawlerForearmBlood"' in inline
          assert 'torso.position.set(0,.69,-.14)' in inline
          assert 'head.position.set(0,1.08,-.235)' in inline
          assert '!o.userData.sharedGeometry' in inline
          assert 'mouth.material=wound;mouth.scale.set(1.22,1.35,1.25)' not in inline
          PY
          node --check /tmp/city-outbreak-v149.js
          git diff --check
      - name: Commit v149
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve crawler gore and low-profile silhouette v149"
          git push origin HEAD:main
