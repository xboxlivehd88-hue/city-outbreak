name: Inspect M4 ACOG Detail
on:
  push:
    paths:
      - ".github/workflows/inspect-m4-acog-detail.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ACOG geometry and alpha
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import json,struct,pathlib,io,statistics
          from PIL import Image
          data=pathlib.Path("assets/ar-15_style_rifle.glb").read_bytes()
          off=12; g=None; binchunk=None
          while off<len(data):
              ln,typ=struct.unpack_from("<II",data,off); off+=8
              ch=data[off:off+ln]; off+=ln
              if typ==0x4E4F534A:g=json.loads(ch.rstrip(b" \t\r\n\x00"))
              elif typ==0x004E4942:binchunk=ch
          mesh=next(m for m in g["meshes"] if m.get("name")=="acog_optic.001_0")
          prim=mesh["primitives"][0]; acc=g["accessors"][prim["attributes"]["POSITION"]]; bv=g["bufferViews"][acc["bufferView"]]
          comp=acc["componentType"]; assert comp==5126
          stride=bv.get("byteStride",12); base=bv.get("byteOffset",0)+acc.get("byteOffset",0)
          pts=[struct.unpack_from("<fff",binchunk,base+i*stride) for i in range(acc["count"])]
          ymin=min(p[1] for p in pts); ymax=max(p[1] for p in pts); yr=ymax-ymin
          def stats(sel):
              if not sel:return None
              xs=sorted(p[0] for p in sel); zs=sorted(p[2] for p in sel)
              return dict(n=len(sel),xmean=sum(xs)/len(xs),xmedian=statistics.median(xs),xmin=xs[0],xmax=xs[-1],
                          zmean=sum(zs)/len(zs),zmedian=statistics.median(zs),zmin=zs[0],zmax=zs[-1])
          print("Y_RANGE",ymin,ymax)
          for name,sel in [
              ("rear_1pct",[p for p in pts if p[1]<=ymin+yr*.01]),
              ("rear_3pct",[p for p in pts if p[1]<=ymin+yr*.03]),
              ("rear_5pct",[p for p in pts if p[1]<=ymin+yr*.05]),
              ("rear_10pct",[p for p in pts if p[1]<=ymin+yr*.10]),
              ("rear_20pct",[p for p in pts if p[1]<=ymin+yr*.20]),
              ("mid_6pct",[p for p in pts if abs(p[1]-(ymin+ymax)/2)<=yr*.03]),
              ("front_20pct",[p for p in pts if p[1]>=ymax-yr*.20]),
              ("front_10pct",[p for p in pts if p[1]>=ymax-yr*.10]),
              ("front_5pct",[p for p in pts if p[1]>=ymax-yr*.05]),
          ]: print("BAND",name,stats(sel))
          # Ring-axis estimate: for narrow y bins, report robust median x/z and radial spread.
          bins=16
          for bi in range(bins):
              lo=ymin+yr*bi/bins; hi=ymin+yr*(bi+1)/bins
              sel=[p for p in pts if lo<=p[1]<hi]
              if not sel:continue
              xs=sorted(p[0] for p in sel);zs=sorted(p[2] for p in sel)
              print("BIN",bi,round((lo+hi)/2,5),"N",len(sel),"XMED",round(statistics.median(xs),5),"ZMED",round(statistics.median(zs),5),"XR",round(xs[-1]-xs[0],5),"ZR",round(zs[-1]-zs[0],5))
          mat=g["materials"][prim["material"]]
          ti=mat["pbrMetallicRoughness"]["baseColorTexture"]["index"]; tex=g["textures"][ti]; src=tex["source"]; im=g["images"][src]
          print("BASECOLOR_IMAGE",src,im)
          ibv=g["bufferViews"][im["bufferView"]]; raw=binchunk[ibv.get("byteOffset",0):ibv.get("byteOffset",0)+ibv["byteLength"]]
          img=Image.open(io.BytesIO(raw)).convert("RGBA")
          alpha=list(img.getchannel("A").getdata())
          vals=sorted(alpha); n=len(vals)
          print("IMAGE",img.size,"ALPHA_MINMAX",vals[0],vals[-1],"UNIQUE",len(set(vals)))
          for q in [0,.01,.05,.1,.25,.5,.75,.9,.95,.99,1]:
              print("ALPHA_Q",q,vals[min(n-1,int(q*(n-1)))])
          counts={"a0":sum(a==0 for a in alpha),"a_lt32":sum(a<32 for a in alpha),"a_lt128":sum(a<128 for a in alpha),"a_lt250":sum(a<250 for a in alpha),"a255":sum(a==255 for a in alpha)}
          print("ALPHA_COUNTS",counts,"TOTAL",n)
          PY
