name: Inspect Havana Transparent Meshes

on:
  push:
    paths:
      - '.github/workflows/inspect-havana-transparent.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transparent and emissive mesh usage
        run: |
          python3 - <<'PY'
          import json,struct,math
          p='assets/modular_havana_street__low-poly_asset_kit.glb'
          data=open(p,'rb').read();off=12;g=None
          while off+8<=len(data):
              n,t=struct.unpack_from('<II',data,off);off+=8
              chunk=data[off:off+n];off+=n
              if t==0x4E4F534A:g=json.loads(chunk.decode('utf-8').rstrip('\x00 \t\r\n'));break
          nodes=g['nodes'];meshes=g['meshes'];mats=g['materials'];acc=g['accessors']
          parents=[None]*len(nodes)
          for i,n in enumerate(nodes):
              for ch in n.get('children',[]):parents[ch]=i
          def mm(a,b):return [[sum(a[r][k]*b[k][c] for k in range(4)) for c in range(4)] for r in range(4)]
          def local(n):
              if 'matrix' in n:
                  m=n['matrix'];return [[m[c*4+r] for c in range(4)] for r in range(4)]
              t=n.get('translation',[0,0,0]);s=n.get('scale',[1,1,1]);x,y,z,w=n.get('rotation',[0,0,0,1])
              R=[[1-2*y*y-2*z*z,2*x*y-2*z*w,2*x*z+2*y*w,0],[2*x*y+2*z*w,1-2*x*x-2*z*z,2*y*z-2*x*w,0],[2*x*z-2*y*w,2*y*z+2*x*w,1-2*x*x-2*y*y,0],[0,0,0,1]]
              S=[[s[0],0,0,0],[0,s[1],0,0],[0,0,s[2],0],[0,0,0,1]];M=mm(R,S);M[0][3]=t[0];M[1][3]=t[1];M[2][3]=t[2];return M
          cache={}
          def world(i):
              if i in cache:return cache[i]
              M=local(nodes[i]);p=parents[i];cache[i]=M if p is None else mm(world(p),M);return cache[i]
          def tx(M,p):
              x,y,z=p;return (M[0][0]*x+M[0][1]*y+M[0][2]*z+M[0][3],M[1][0]*x+M[1][1]*y+M[1][2]*z+M[1][3],M[2][0]*x+M[2][1]*y+M[2][2]*z+M[2][3])
          def prim_bounds(pr,M):
              ai=pr.get('attributes',{}).get('POSITION')
              if ai is None:return None
              a=acc[ai]
              if 'min' not in a or 'max' not in a:return None
              lo,hi=a['min'],a['max'];pts=[tx(M,(x,y,z)) for x in (lo[0],hi[0]) for y in (lo[1],hi[1]) for z in (lo[2],hi[2])]
              mn=[min(p[k] for p in pts) for k in range(3)];mx=[max(p[k] for p in pts) for k in range(3)]
              return mn,mx
          print('TRANSPARENT_MESHES')
          for ni,n in enumerate(nodes):
              mi=n.get('mesh')
              if mi is None:continue
              M=world(ni)
              for pi,pr in enumerate(meshes[mi].get('primitives',[])):
                  mat=pr.get('material')
                  if mat is None:continue
                  m=mats[mat]
                  if m.get('alphaMode','OPAQUE')!='BLEND':continue
                  b=prim_bounds(pr,M)
                  if b:
                      mn,mx=b;cen=[(mn[k]+mx[k])/2 for k in range(3)];sz=[mx[k]-mn[k] for k in range(3)]
                      print({'node':ni,'nodeName':n.get('name'),'mesh':mi,'meshName':meshes[mi].get('name'),'prim':pi,'material':mat,'matName':m.get('name'),'center':[round(x,3) for x in cen],'size':[round(x,3) for x in sz]})
          print('EMISSIVE_MESHES')
          for ni,n in enumerate(nodes):
              mi=n.get('mesh')
              if mi is None:continue
              M=world(ni)
              for pi,pr in enumerate(meshes[mi].get('primitives',[])):
                  mat=pr.get('material')
                  if mat is None:continue
                  m=mats[mat]
                  ef=m.get('emissiveFactor',[0,0,0])
                  if max(ef or [0])<=0:continue
                  b=prim_bounds(pr,M)
                  if b:
                      mn,mx=b;cen=[(mn[k]+mx[k])/2 for k in range(3)];sz=[mx[k]-mn[k] for k in range(3)]
                      print({'node':ni,'nodeName':n.get('name'),'mesh':mi,'meshName':meshes[mi].get('name'),'prim':pi,'material':mat,'matName':m.get('name'),'emissive':ef,'center':[round(x,3) for x in cen],'size':[round(x,3) for x in sz]})
          PY
