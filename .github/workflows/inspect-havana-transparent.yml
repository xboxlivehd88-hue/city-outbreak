name: Inspect Havana Transparent Texture

on:
  push:
    paths:
      - '.github/workflows/inspect-havana-transparent.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transparent texture alpha
        run: |
          python3 - <<'PY'
          import json,struct,io
          from PIL import Image
          p='assets/modular_havana_street__low-poly_asset_kit.glb'
          data=open(p,'rb').read();off=12;g=None;binchunk=None
          while off+8<=len(data):
              n,t=struct.unpack_from('<II',data,off);off+=8
              chunk=data[off:off+n];off+=n
              if t==0x4E4F534A:g=json.loads(chunk.decode('utf-8').rstrip('\x00 \t\r\n'))
              elif t==0x004E4942:binchunk=chunk
          print('TEXTURE_15',g['textures'][15])
          src=g['textures'][15].get('source')
          print('IMAGE_SOURCE',src,g['images'][src])
          bv_idx=g['images'][src].get('bufferView');bv=g['bufferViews'][bv_idx]
          start=bv.get('byteOffset',0);end=start+bv['byteLength']
          im=Image.open(io.BytesIO(binchunk[start:end])).convert('RGBA')
          alpha=im.getchannel('A')
          hist=alpha.histogram();total=im.width*im.height
          transparent=sum(hist[:255]);zero=hist[0];partial=sum(hist[1:255])
          print('IMAGE_SIZE',im.size)
          print('ALPHA_TRANSPARENT_PERCENT',round(transparent*100/total,3))
          print('ALPHA_ZERO_PERCENT',round(zero*100/total,3))
          print('ALPHA_PARTIAL_PERCENT',round(partial*100/total,3))
          # coarse RGB average over visible pixels to hint at content type
          pix=list(im.getdata());vis=[p for p in pix if p[3]>32]
          if vis:
              avg=tuple(round(sum(p[i] for p in vis)/len(vis),1) for i in range(3))
              print('VISIBLE_RGB_AVG',avg)
          PY
