name: One-shot reload smoothing patch

on:
  push:
    paths:
      - '.github/workflows/patch-reload-smoothing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply reload smoothing patch
        run: python3 .github/patch_reload_smoothing.py
      - name: Commit gameplay patch
        run: |
          git config user.name 'city-outbreak-bot'
          git config user.email 'city-outbreak-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Smooth magazine drop and fresh reload sequence'
          git push origin main
