name: v779 Local Flight Recorder Playwright
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/game.js'
      - 'src/frame-flight-recorder.mjs'
      - 'index.html'
      - 'tests/performance/flight-recorder.test.mjs'
      - 'tests/visual/flight-recorder-smoke.test.mjs'
      - '.github/workflows/flight-recorder-playwright.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recorder:
    name: Recorder bounded-memory and real-browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check module syntax and recorder unit tests
        run: |
          node --check src/game.js
          node --check src/frame-flight-recorder.mjs
          node --test tests/performance/flight-recorder.test.mjs
      - name: Install Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve PR files
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/city-http.log 2>&1 &
      - name: Real Chromium performance recorder smoke
        env:
          CITY_TEST_URL: http://127.0.0.1:8765
        run: node --test tests/visual/flight-recorder-smoke.test.mjs
      - name: Archive diagnostic export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flight-recorder-v779-${{ github.run_number }}
          path: test-results/flight-recorder/
          if-no-files-found: warn
          retention-days: 14
