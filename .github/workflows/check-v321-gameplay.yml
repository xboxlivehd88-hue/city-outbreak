name: Check v321 Gameplay JS

on:
  push:
    paths:
      - '.github/workflows/check-v321-gameplay.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check modules
        run: |
          node --input-type=module --check < src/game.js
          node --input-type=module --check < src/wave-utils.js
