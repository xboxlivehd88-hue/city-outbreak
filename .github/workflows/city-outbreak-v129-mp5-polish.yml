name: CITY OUTBREAK v129 MP5 polish
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "be2c75c5b305e1a07764c0ca6b209cccea8c5a4b"
      - name: Apply MP5 polish patch
        run: python3 .github/city-outbreak-v129-mp5-polish.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          inline = max(scripts, key=len)
          Path("/tmp/city-outbreak-v129.js").write_text(inline, encoding="utf-8")
          PY
          node --check /tmp/city-outbreak-v129.js
          git diff --check
      - name: Commit v129
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish MP5 geometry sights and ADS v129"
          git push origin HEAD:main
