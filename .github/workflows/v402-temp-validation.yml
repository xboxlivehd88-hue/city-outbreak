name: v402 temporary validation
on:
  push:
    paths:
      - '.github/workflows/v402-temp-validation.yml'
      - 'src/game.js'
      - 'index.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v402
        run: |
          git diff --check HEAD^ HEAD
          cp src/game.js /tmp/game.mjs
          node --check /tmp/game.mjs
          grep -Fq './src/game.js?v=402' index.html
          grep -Fq 'const armMinFrac=.12+THREE.MathUtils.clamp((.70-yf)/.34,0,1)*.04' src/game.js
          grep -Fq 'kneeBase=.10+.05*run,kneeAmp=.62+.54*run' src/game.js
          grep -Fq 'let the approved root ragdoll move/tumble the whole zombie' src/game.js
          grep -Fq '(z.radiatedGreenVisual||z.walkerVisual)?radiatedSpinTopTarget(z):null' src/game.js
          grep -Fq 'm240:{x:-.36,y:.01,z:1.20,fov:56,rx:0}' src/game.js
          grep -Fq 'RECENT_ZOMBIE_SPAWN_LIMIT=96' src/game.js
          grep -Fq 'if(!zombieSpawnConnectedToPlayer(x,z))return false;' src/game.js
