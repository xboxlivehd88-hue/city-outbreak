name: v585 boss-rotation browser validation
on:
  push:
    paths:
      - '.github/workflows/boss-rotation-validation.yml'
      - 'scripts/boss-rotation-validation.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Wave 1, Panzer in Wave 10, no-repeat boss names
        run: |
          python3 -m http.server 4173 >/tmp/boss-rotation-http.log 2>&1 &
          sleep 2
          node scripts/boss-rotation-validation.cjs || true
      - name: Publish browser verification report
        if: always()
        run: |
          if [ -f BOSS_ROTATION_V585_AUDIT.json ]; then
            git config user.name "city-outbreak-audit[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add BOSS_ROTATION_V585_AUDIT.json
            if ! git diff --cached --quiet; then
              git commit -m "diagnostics: v585 boss rotation browser verification"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Require success
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open('BOSS_ROTATION_V585_AUDIT.json'))
          assert a['pass'],a.get('failure','Boss rotation test did not pass')
          print('PASS: v585 boss rotation',a['bossPool'],a['bossWave'])
          PY
