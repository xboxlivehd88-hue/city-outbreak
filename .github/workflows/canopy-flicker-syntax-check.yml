name: v551 native crawler GLB and bone mapping validation
on:
  push:
    branches: [canopy-inspection-probe]
    paths: [.github/workflows/canopy-flicker-syntax-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate game.js syntax, asset loader, native vs leg-loss isolation
        run: |
          node --input-type=module --check < src/game.js
          grep -F 'src="./src/game.js?v=551"' index.html
          grep -F 'const naturalCrawlerSpawn=kind==="crawler"&&forcedKind!=="crawler";' src/game.js
          grep -F 'makeZombie(x,zp,oldIndex,"crawler")' src/game.js
          grep -F 'SkeletonUtils.clone(naturalCrawlerAsset.scene)' src/game.js
          grep -F 'return{holder:z.naturalCrawlerVisual,bones:z.naturalCrawlerBones,kind:"nativeCrawler"}' src/game.js
          grep -F 'if(z.naturalCrawlerMixer)z.naturalCrawlerMixer.stopAllAction();' src/game.js
          grep -F 'gasCanopyFirstApproachArmed' src/game.js
          test -f MODEL_CREDITS.md
      - name: Check real source Mixamo joints and numbered bone labels
        run: |
          python3 - <<'PY'
          import json,struct,re
          p=open('assets/zombie_number_3_-_animated.glb','rb').read()
          assert p[:4]==b'glTF'
          n,t=struct.unpack_from('<II',p,12)
          j=json.loads(p[20:20+n])
          clips={a['name'] for a in j['animations']}
          assert {'Crawl','Running_Crawl','Attack'}<=clips,clips
          normal=lambda n:re.sub('^mixamorig','',re.sub('[^a-z0-9]','',re.sub('_\\d+$','',n.lower())))
          names={normal(v.get('name','')) for v in j['nodes']}
          want={'hips','spine','spine2','neck','head','leftarm',
           'leftforearm','lefthand','rightarm','rightforearm','righthand',
           'leftupleg','leftleg','leftfoot','rightupleg','rightleg','rightfoot'}
          missing=want-names
          assert not missing,missing
          assert normal('mixamorig:Spine_53')=='spine'
          assert normal('mixamorig:Spine2_51')=='spine2'
          assert len(j.get('skins',[]))==1
          print('PASS: animation clips, 17 unique real Mixamo joints and Spine2 binding.')
          PY