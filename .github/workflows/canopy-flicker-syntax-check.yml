name: v553 crawler pose, floor and face regression
on:
  push:
    branches: [canopy-inspection-probe]
    paths: [.github/workflows/canopy-flicker-syntax-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check ES-module syntax and targeted model fixes
        run: |
          node --input-type=module --check < src/game.js
          grep -F 'src="./src/game.js?v=553"' index.html
          grep -F 'm.transparent=false;m.alphaTest=.09;m.depthWrite=true;' src/game.js
          grep -F 'Math.abs(lift)<8' src/game.js
          grep -F 'z.naturalCrawlerMixer.timeScale=0;' src/game.js
          grep -F 'bones.get("Head")?.rotateX(-.26);' src/game.js
          grep -F 'makeZombie(x,zp,oldIndex,"crawler");' src/game.js
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const s=fs.readFileSync('src/game.js','utf8');
          const section=(a,b)=>s.slice(s.indexOf(a),s.indexOf(b));
          const start=section('function beginRagdoll(z','function updateRagdoll(z');
          assert(start.includes('z.naturalCrawlerMixer.timeScale=0'), 'holds last live pose');
          assert(!start.includes('z.naturalCrawlerMixer.stopAllAction()'), 'no bind-pose snap on death');
          const attach=section('function attachNaturalCrawlerVisual(z','const PLAYER_WORLD_SCALE=');
          assert(attach.includes('updateNaturalCrawlerGroundPose(z,0,true)'), 'spawn-ground calibration');
          assert(attach.includes('updateNaturalCrawlerGroundPose(z,dt)'), 'runtime animated clearance');
          assert(!attach.includes('clamp(lift,-1.4,1.4)'), 'old fixed lifting limit removed');
          assert(attach.includes('bones.get("Head")?.rotateX(-.26)'), 'raise skull');
          assert(s.includes('kind==="crawler"&&forcedKind!=="crawler"'), 'only naturally spawned crawler');
          assert(s.includes('makeZombie(x,zp,oldIndex,"crawler")'), 'leg-loss converted model unchanged');
          assert(s.includes('function sweepBodyPbdWall(n,pad)'), 'v549 ragdoll wall safety');
          assert(s.includes('Math.round(380+440*Math.pow(.53,reloadLevel))'), 'v548 reload');
          console.log('PASS native crawler head/ground/death handoff and gameplay preservation');
          NODE
      - name: Confirm original new crawler Body face uses BLEND
        run: |
          python3 - <<'PY'
          import json,struct
          b=open('assets/zombie_number_3_-_animated.glb','rb').read()
          ln,t=struct.unpack_from('<II',b,12)
          j=json.loads(b[20:20+ln])
          material=next(m for m in j['materials'] if m['name']=='Body')
          assert material.get('alphaMode')=='BLEND'
          assert material.get('doubleSided') is True
          print('PASS original GLB face Body material expected; source unchanged')
          PY