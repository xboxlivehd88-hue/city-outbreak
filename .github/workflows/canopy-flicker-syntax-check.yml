name: v548 shotgun faster-reload syntax and timing check
on:
  push:
    branches: [canopy-inspection-probe]
    paths: [.github/workflows/canopy-flicker-syntax-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check ES-module syntax and balance using latest main
        run: |
          node --version
          node --input-type=module --check < src/game.js
          grep -F 'src="./src/game.js?v=548"' index.html
          grep -F 'const shellDuration=Math.round(380+440*Math.pow(.53,reloadLevel));' src/game.js
          grep -F 'reloadStartedAt=gameTimeNow();reloadDurationMs=shellDuration;shellLoadS();' src/game.js
          grep -F '},shellDuration)' src/game.js
          grep -F 'shotgunReloadShellIndex=a.mag===0?0:1;' src/game.js
          node -e 'const want=[820,613,504,446]; for(let i=0;i<want.length;i++){let got=Math.round(380+440*Math.pow(.53,i)); if(got!==want[i])throw new Error("duration mismatch "+i+" "+got);console.log("Upgrade",i,got,"ms per shell /",got*8,"ms for 8 rounds")}'