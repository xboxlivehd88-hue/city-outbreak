name: v550 natural crawler GLB isolation and JS syntax validation
on:
  push:
    branches: [canopy-inspection-probe]
    paths: [.github/workflows/canopy-flicker-syntax-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate game syntax and targeted crawler-only code
        run: |
          node --input-type=module --check < src/game.js
          grep -F 'src="./src/game.js?v=550"' index.html
          grep -F 'const naturalCrawlerSpawn=kind==="crawler"&&forcedKind!=="crawler";' src/game.js
          grep -F 'makeZombie(x,zp,oldIndex,"crawler")' src/game.js
          grep -F 'SkeletonUtils.clone(naturalCrawlerAsset.scene)' src/game.js
          grep -F 'return{holder:z.naturalCrawlerVisual,bones:z.naturalCrawlerBones,kind:"nativeCrawler"}' src/game.js
          grep -F 'if(z.naturalCrawlerMixer)z.naturalCrawlerMixer.stopAllAction();' src/game.js
          test -f MODEL_CREDITS.md
      - name: Verify uploaded Mixamo source matches animation and bone bindings
        run: |
          python3 - <<'PY'
          import json,struct,re
          p=open('assets/zombie_number_3_-_animated.glb','rb').read()
          assert p[:4]==b'glTF'
          ln,t=struct.unpack_from('<II',p,12)
          j=json.loads(p[20:20+ln])
          clips={a['name'] for a in j['animations']}
          assert {'Crawl','Running_Crawl','Attack'}<=clips,clips
          nodes=j['nodes']
          names=set()
          for n in nodes:
           name=re.sub('[^a-z]','',n.get('name','').lower())
           name=re.sub('^mixamorig','',name)
           names.add(name)
          desired={'hips','spine','spine2','neck','head',
           'leftarm','leftforearm','lefthand','rightarm','rightforearm','righthand',
           'leftupleg','leftleg','leftfoot','rightupleg','rightleg','rightfoot'}
          missing=desired-names
          assert not missing,missing
          assert len(j.get('skins',[]))==1
          print('PASS crawler GLB clip names, bone mapping (',len(desired),'bones), skinned mesh format')
          PY