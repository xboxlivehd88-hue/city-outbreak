name: Inspect native crawler face materials and animation offsets
on:
  push:
    branches: [canopy-inspection-probe]
    paths: [.github/workflows/canopy-flicker-syntax-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect face alpha, local geometry and original rest pose
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          b=Path('assets/zombie_number_3_-_animated.glb').read_bytes()
          n,t=struct.unpack_from('<II',b,12);j=json.loads(b[20:20+n])
          for k,v in enumerate(j.get('materials',[])):
           p=v.get('pbrMetallicRoughness',{})
           print('MATERIAL',k,v.get('name'),'alphaMode',v.get('alphaMode'),'baseColor',p.get('baseColorFactor'),'doubleSided',v.get('doubleSided'),'alphaCutoff',v.get('alphaCutoff'))
          for k,v in enumerate(j.get('nodes',[])):
           if any(s in v.get('name','').lower() for s in ['head_','neck_','hips_','spine2_','leftforearm_','righthand_','rightfoot_']):
            print('BONE',k,v.get('name'),'T',v.get('translation'),'Q',v.get('rotation'),'scale',v.get('scale'))
          for k,v in enumerate(j.get('meshes',[])):
           print('MESH',k,v.get('name'),[x.get('material') for x in v['primitives']])
          print('FACE_MATERIAL_CHECK_COMPLETE')
          PY