name: v547 sprint and healing syntax check
on:
  push:
    branches: [canopy-inspection-probe]
    paths: [.github/workflows/canopy-flicker-syntax-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate current main JS and balance settings
        run: |
          node --input-type=module --check < src/game.js
          grep -F 'src="./src/game.js?v=547"' index.html
          grep -F 'const PLAYER_HEALTH_REGEN_DELAY=5,PLAYER_HEALTH_REGEN_RATE=12.5;' src/game.js
          grep -F 'const PLAYER_SPRINT_DRAIN_RATE=26.67;' src/game.js
          grep -F 'sprintEnergy-PLAYER_SPRINT_DRAIN_RATE*dt' src/game.js
          grep -F 'sprintEnergy+14*dt' src/game.js
          grep -F 'sprintLocked&&sprintEnergy>=100' src/game.js
          grep -F 'health+PLAYER_HEALTH_REGEN_RATE*dt' src/game.js
          grep -F 'function updateGasCanopyFlicker(t)' src/game.js