name: Inspect crawler animation locomotion and root motion
on:
  push:
    branches: [canopy-inspection-probe]
    paths: [.github/workflows/canopy-flicker-syntax-check.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Report crawler GLB root transforms and skeletal motion
        run: |
          python3 - <<'PY'
          import json,struct,collections
          from pathlib import Path
          data=Path('assets/zombie_number_3_-_animated.glb').read_bytes()
          size,t=struct.unpack_from('<II',data,12);j=json.loads(data[20:20+size])
          off=20+size
          off+=(4-size%4)%4
          blen,btyp=struct.unpack_from('<II',data,off);binary=data[off+8:off+8+blen]
          nodes=j['nodes']
          for i in range(18):
           n=nodes[i]
           print('TOPNODE',i,n.get('name'),'translation',n.get('translation'),'rotation',n.get('rotation'),'scale',n.get('scale'),'matrix',n.get('matrix'),'children',n.get('children'))
          ty={5126:('f',4),5123:('H',2),5125:('I',4)}
          def acc_values(i):
           a=j['accessors'][i]
           view=j['bufferViews'][a['bufferView']]
           count={'SCALAR':1,'VEC3':3,'VEC4':4}[a['type']]
           f,w=ty[a['componentType']]
           stride=view.get('byteStride',w*count)
           start=view.get('byteOffset',0)+a.get('byteOffset',0)
           return [struct.unpack_from('<'+f*count,binary,start+k*stride) for k in range(a['count'])]
          for ai,a in enumerate(j.get('animations',[])):
           if a.get('name') not in ('Running_Crawl','Crawl','Idle','Attack','Death'):continue
           print('CLIP',ai,a.get('name'))
           for ch in a.get('channels',[]):
            node=ch['target']['node']
            path=ch['target']['path']
            if path!='translation' or node not in (5,18,19,20,21,22,23,73,78):continue
            track=a['samplers'][ch['sampler']]
            vals=acc_values(track['output'])
            low=[min(v[k] for v in vals) for k in range(len(vals[0]))]
            high=[max(v[k] for v in vals) for k in range(len(vals[0]))]
            print('TRACK',nodes[node].get('name'),path,'frames',len(vals),'first',tuple(round(q,3) for q in vals[0]),'min',tuple(round(q,3) for q in low),'max',tuple(round(q,3) for q in high))
          print('ROOT_MOTION_INSPECTION_COMPLETE')
          PY