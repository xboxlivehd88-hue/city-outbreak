name: CITY OUTBREAK v145 remove shop heal
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "0be68094f8a3cdda3dafcf4c85611984c05870bf"
      - name: Apply v145 patch
        run: python3 .github/city-outbreak-v145-remove-shop-heal.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          assert 'data-buy="heal"' not in html
          assert 'type==="heal"' not in html
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v145.js").write_text(inline,encoding="utf-8")
          PY
          node --check /tmp/city-outbreak-v145.js
          git diff --check
      - name: Commit v145
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove redundant shop heal purchase v145"
          git push origin HEAD:main
