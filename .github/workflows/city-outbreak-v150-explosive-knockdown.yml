name: CITY OUTBREAK v150 explosive knockdown
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "ed6e2bd666ca010c1da1eaf0b3d76ab594e06855"
      - name: Apply v150 patch
        run: python3 .github/city-outbreak-v150-explosive-knockdown.py
      - name: Validate JavaScript and blast reactions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v150.js").write_text(inline,encoding="utf-8")
          assert 'const fallAngle=1.52+Math.min(.09,power*.045);' in inline
          assert 'impactT:0,impactScale:.90+power*.35' in inline
          assert 'const whip=Math.sin(k.impactT*' in inline
          assert 'groundDrop:z.kind==="crawler"?.025:.085' in inline
          assert 'else blastReact(z,p,.70+force*1.15)' in inline
          assert 'else blastReact(z,p,.55+force*.95)' in inline
          assert 'blastReact(z,p,.70+force*1.15);if(z.kind!=="boss")stagger' not in inline
          assert 'blastReact(z,p,.55+force*.95);if(z.kind!=="boss")stagger' not in inline
          assert 'if(z.kind==="boss"){' in inline
          PY
          node --check /tmp/city-outbreak-v150.js
          git diff --check
      - name: Commit v150
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make explosions knock zombies down with limb reaction v150"
          git push origin HEAD:main
