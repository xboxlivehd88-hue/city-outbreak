name: One-shot first-person hands reload patch

on:
  push:
    paths:
      - '.github/workflows/patch-hands-reload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch first-person hands and reload animation
        run: python3 .github/patch_hands_reload.py
      - name: Commit patch
        run: |
          git config user.name 'city-outbreak-bot'
          git config user.email 'city-outbreak-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Add first-person weapon hands and reload animation'
          git push origin main
