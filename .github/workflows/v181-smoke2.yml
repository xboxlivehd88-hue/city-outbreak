name: v181 smoke 2 final
on:
  push:
    paths:
      - '.github/workflows/v181-smoke2.yml'
      - 'index.html'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact assertions and diff check
        continue-on-error: true
        run: |
          git diff --check 34a9cabbb3c8f2fa04f1b5ff6d34af6fbd224771 HEAD -- index.html
          grep -Fq 'body:1,recoil:.105,baseMag:12' index.html
          grep -Fq 'const infiniteStarterAmmo=weapon==="pistol";' index.html
          grep -Fq 'if(!infiniteStarterAmmo)A().mag--' index.html
          grep -Fq "function reload(w=weapon){if(w==='pistol')" index.html
          grep -Fq 'assets/classic_m4.glb.glb' index.html
          grep -Fq 'assets/2018_subaru_wrx_sti.glb' index.html
          grep -Fq 'const pendingStiSedans=[];' index.html
          grep -Fq 'g.userData.stiVisual=true' index.html
          grep -Fq 'MAX_ACTIVE_ZOMBIES=20' index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Real browser smoke
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const glb=[];
            page.on('response',r=>{if(r.url().includes('.glb')) glb.push([r.url(),r.status()]);});
            await page.goto('http://127.0.0.1:4173/?debug=1',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1800);
            const sti=glb.find(x=>x[0].includes('2018_subaru_wrx_sti.glb')&&x[1]===200);
            const m4=glb.find(x=>x[0].includes('classic_m4.glb.glb')&&x[1]===200);
            if(!sti) throw new Error('STI GLB did not load 200');
            await page.waitForFunction(()=>+(document.documentElement.dataset.stiVisuals||0)>0,null,{timeout:45000});
            const stiCount=+(await page.locator('html').getAttribute('data-sti-visuals')||0);
            if(stiCount<1) throw new Error('STI loaded but no sedan visual was instantiated');
            if(!m4) throw new Error('M4 GLB did not load 200');
            await page.locator('#start').click();
            await page.waitForTimeout(1200);
            const startDisplay=await page.locator('#startScreen').evaluate(el=>getComputedStyle(el).display);
            if(startDisplay!=='none') throw new Error('START OUTBREAK failed');
            const ammo=(await page.locator('#ammo').textContent()).trim();
            if(!/^\d+\s*\/\s*\d+$/.test(ammo)) throw new Error('M4 ammo display not finite: '+ammo);
            if(errors.length) throw new Error('JS errors: '+errors.join(' | '));
            if(await page.locator('text=GAME ERROR:').count()) throw new Error('GAME ERROR overlay present');
            console.log('PASS START/M4/STI', {ammo,sti:!!sti,m4:!!m4,stiCount});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
