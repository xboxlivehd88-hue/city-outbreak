name: CITY OUTBREAK v134 crawler hitboxes
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "696dc5b251490d78bc80e61a45c99989be437f52"
      - name: Apply v134 patch
        run: python3 .github/city-outbreak-v134-crawler-hitboxes.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v134.js").write_text(inline,encoding="utf-8")
          PY
          node --check /tmp/city-outbreak-v134.js
          git diff --check
      - name: Commit v134
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix converted crawler shooting hitboxes v134"
          git push origin HEAD:main
