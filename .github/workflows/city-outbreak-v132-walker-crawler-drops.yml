name: CITY OUTBREAK v132 walker crawler drops
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected source
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "1415511dff10a781fa46984c87451d8209176b60"
      - name: Apply v132 patch
        run: python3 .github/city-outbreak-v132-walker-crawler-drops.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path("/tmp/city-outbreak-v132.js").write_text(inline,encoding="utf-8")
          PY
          node --check /tmp/city-outbreak-v132.js
          git diff --check
      - name: Commit v132
        shell: bash
        run: |
          git config user.name "CITY OUTBREAK Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve walkers legless crawlers and drops v132"
          git push origin HEAD:main
