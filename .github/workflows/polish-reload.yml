name: One-shot reload polish

on:
  push:
    paths:
      - '.github/workflows/polish-reload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Polish reload animation
        run: python3 .github/polish_reload.py
      - name: Commit polish
        run: |
          git config user.name 'city-outbreak-bot'
          git config user.email 'city-outbreak-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish reload ADS exit and magazine motion'
          git push origin main
