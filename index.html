<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Outbreak</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center}#load{padding:30px;text-align:center}small{color:#bbb}</style></head><body><div id="load"><h1>CITY OUTBREAK</h1><p>Loading playable build…</p><small>Chrome or Edge recommended</small></div><script type="module">try{const files=[1,2,3,4,5].map(n=>`./build/game.part${n}?v=42`);const parts=await Promise.all(files.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`Failed to load ${u}`);return(await r.text()).trim()}));const b=parts.join('');const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replace("if(z.surgeT<=0){z.surgeT=.65+rnd()*1.7;z.zig*=-1}z.think-=dt;\nif(z.think<=0){","if(z.surgeT<=0){z.surgeT=.65+rnd()*1.7;z.zig*=-1}z.think-=dt;\nconst playerDistToZombie=Math.hypot(px-z.g.position.x,pz-z.g.position.z);\nif(z.think<=0){");html=html.replace(" const playerDistToZombie=Math.hypot(px-z.g.position.x,pz-z.g.position.z);\n if(active.length<=2&&playerDistToZombie>42){tx=px;tz=pz;}"," if(active.length<=2&&playerDistToZombie>42){tx=px;tz=pz;}");html=html.replace('</body>',`<script>window.addEventListener('error',function(e){if(document.getElementById('runtimeErr'))return;const d=document.createElement('div');d.id='runtimeErr';d.style.cssText='position:fixed;left:12px;bottom:12px;z-index:99999;background:rgba(120,0,0,.94);color:#fff;padding:10px 12px;font:13px monospace;max-width:75vw;border:1px solid #fff';d.textContent='GAME ERROR: '+(e.message||'unknown error');document.body.appendChild(d);});<\/script></body>`);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML=`<div style="padding:30px;max-width:700px"><h1>CITY OUTBREAK</h1><p>The game failed to load.</p><p>${String(e.message||e)}</p><p>Please refresh with Ctrl+F5 in Chrome or Edge.</p></div>`}</script></body></html>
