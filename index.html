n const arm=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,1.1,8),M(0x282d2d,.45));arm.rotation.z=Math.PI/2;arm.position.set(.48*dir,4.45,0);g.add(arm);\n const bulb=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),M(0xffd99a,.25));bulb.position.set(1*dir,4.45,0);g.add(bulb);\n box(.32,.08,.28,M(0x202526,.55),.98*dir,4.53,0,g);\n g.position.set(x,0,z);scene.add(g)\n}\nfor(let z=-70;z<135;z+=28){lamp(-12,z,1);lamp(12,z+12,-1)}");html=html.replace("function addBuilding(w,h,d,x,z,base,variant){\n const q=box(w,h,d,facadeMaterial(base,variant),x,h/2,z);buildingColliders.push({x,z,hx:w/2,hz:d/2});\n const roof=M(0x4c5050,.94);\n box(w*.92,.16,d*.92,roof,x,h+.08,z);\n // Rooftop mechanical detail makes the skyline read less like plain blocks.\n if(variant%2===0){box(2.1,.7,1.55,M(0x6f7471,.72),x-w*.18,h+.43,z+d*.12);box(.75,.35,.75,M(0x3a4140,.62),x+w*.18,h+.26,z-d*.16)}\n return q\n}","function addBuilding(w,h,d,x,z,base,variant){\n const style=variant%6,mat=facadeMaterial(base,variant),q=box(w,h,d,mat,x,h/2,z);\n buildingColliders.push({x,z,hx:w/2,hz:d/2});\n const roof=M(style===1?0x30383c:style===3?0x554d46:0x4c5050,.94);\n box(w*.94,.16,d*.94,roof,x,h+.08,z);\n\n if(style===0){\n   box(w*.7,1.4,d*.62,facadeMaterial(base,variant+31),x,h+.78,z);\n   box(2.1,.7,1.55,M(0x6f7471,.72),x-w*.18,h+1.55,z+d*.12);\n }else if(style===1){\n   for(let yy=h*.22;yy<h*.92;yy+=h*.19)box(w*1.015,.12,d*1.015,M(0x7b8080,.58),x,yy,z);\n   box(w*.45,.55,d*.35,M(0x32383a,.7),x+w*.12,h+.36,z);\n }else if(style===2){\n   box(w*.72,h*.18,d*.72,facadeMaterial(base,variant+41),x,h+h*.09,z);\n   box(1.1,1.8,1.1,M(0x414748,.72),x-w*.22,h+1.0,z-d*.12);\n }else if(style===3){\n   box(w*1.03,.28,d*1.03,M(0x756a5e,.82),x,h*.16,z);\n   box(w*1.03,.28,d*1.03,M(0x756a5e,.82),x,h*.58,z);\n   box(.85,2.2,.85,M(0x4a5050,.75),x+w*.2,h+1.1,z+d*.18);\n }else if(style===4){\n   box(w*.82,1.0,d*.82,facadeMaterial(base,variant+53),x,h+.54,z);\n   for(const sx of [-1,1])box(.35,.7,d*.55,M(0x313637,.76),x+sx*w*.28,h+.42,z);\n }else{\n   box(w*.9,.5,d*.24,M(0x2c3030,.8),x,h*.35,z-d*.4);\n   box(2.4,.5,.18,M(0x792b27,.7),x,h*.34,z-d*.51);\n   box(1.5,.7,1.5,M(0x555b59,.72),x-w*.2,h+.43,z);\n   box(.75,.35,.75,M(0x313839,.64),x+w*.22,h+.23,z-d*.18);\n }\n return q\n}");html=html.replace("let fw=new THREE.Mesh(new THREE.SphereGeometry(.085,6,5),wound);fw.scale.set(1,.55,.3);fw.position.set(i%2?.19:-.19,.05,-.32);head.add(fw);box(.23,.3,.025,wound,i%2?.17:-.18,1.5,-.245,g).rotation.z=.35;let armL=box(.19,.9,.19,skin,-.48,1.53,.15,g),armR=box(.19,.9,.19,skin,.48,1.53,.15,g);","let fw=new THREE.Mesh(new THREE.SphereGeometry(.085,6,5),wound);fw.scale.set(1,.55,.3);fw.position.set(i%2?.19:-.19,.05,-.32);head.add(fw);\nif(i%2===0){let cheek=new THREE.Mesh(new THREE.SphereGeometry(.11,7,5),wound);cheek.scale.set(.8,.55,.25);cheek.position.set(-.23,-.06,-.31);head.add(cheek)}\nfor(let t=-1;t<=1;t++){box(.045,.055,.025,M(0xd7d0b6,.78),t*.055,-.13,-.37,head)}\nbox(.23,.3,.025,wound,i%2?.17:-.18,1.5,-.245,g).rotation.z=.35;\nif(i%3===1){box(.18,.055,.04,M(0xc2b59b,.72),-.12,1.39,-.27,g);box(.17,.05,.04,M(0xc2b59b,.72),.10,1.31,-.27,g)}\nlet armL=box(.19,.9,.19,skin,-.48,1.53,.15,g),armR=box(.19,.9,.19,skin,.48,1.53,.15,g);");html=html.replace("let safe=pushOutsideBuilding(x,z,.52);g.position.set(safe.x,0,safe.z);scene.add(g);let zz={g,head,torso,armL,armR,legL,legR,hp:d.hp","let safe=pushOutsideBuilding(x,z,.52);g.position.set(safe.x,0,safe.z);scene.add(g);const baseArmLX=armL.rotation.x,baseArmRX=armR.rotation.x,headLean=(rnd()-.5)*.18,gait=.8+rnd()*.45,bob=.015+rnd()*.018;let zz={g,head,torso,armL,armR,legL,legR,baseArmLX,baseArmRX,headLean,gait,bob,hp:d.hp");html=html.replace("z.g.rotation.y=Math.atan2(dx,dz)+Math.PI;z.torso.rotation.z=Math.sin(z.phase)*.08;z.armL.rotation.z=-.12+Math.sin(z.phase)*.12;z.armR.rotation.z=.16-Math.sin(z.phase)*.12;if(d>1.05){","z.g.rotation.y=Math.atan2(dx,dz)+Math.PI;const walk=Math.sin(z.phase*z.gait),walk2=Math.sin(z.phase*z.gait+Math.PI);z.torso.rotation.z=walk*.055;z.torso.rotation.x=(z.role===\"charger\"?-.08:z.role===\"stalker\"?.10:0)+Math.abs(walk)*.035;z.torso.rotation.y=walk*.045;z.head.rotation.z=z.headLean+Math.sin(z.phase*.55)*.045;z.head.rotation.y=Math.sin(z.phase*.42)*.09;z.armL.rotation.x=z.baseArmLX+walk*.22;z.armR.rotation.x=z.baseArmRX+walk2*.22;z.armL.rotation.z=-.12+walk*.10;z.armR.rotation.z=.16-walk*.10;z.legL.rotation.x=walk2*.34*(1-z.legDamage*.12);z.legR.rotation.x=walk*.34*(1-z.legDamage*.12);z.g.position.y=Math.abs(walk)*z.bob;if(d>1.05){");html=html.replace("let base=[0x555b5e,0x6c625b,0x4c565c,0x67645e][Math.floor(rnd()*4)];\n    let w1=10+rnd()*6,h1=15+rnd()*27,d1=12+rnd()*6,x1=side*(21+rnd()*6);\n    addBuilding(w1,h1,d1,x1,z,base,buildingId++);\n    if(rnd()>.18){\n      let w2=9+rnd()*5,h2=13+rnd()*24,d2=11+rnd()*5,x2=side*(37+rnd()*10);\n      addBuilding(w2,h2,d2,x2,z+(rnd()-.5)*4,base,buildingId++);\n    }","let base=[0x555b5e,0x6c625b,0x4c565c,0x67645e,0x6b5245,0x465c55,0x5f5968][Math.floor(rnd()*7)];\n    let w1=9+rnd()*8,h1=12+rnd()*34,d1=11+rnd()*8,x1=side*(20+rnd()*7);\n    addBuilding(w1,h1,d1,x1,z+(rnd()-.5)*2.5,base,buildingId++);\n    if(rnd()>.14){\n      let base2=[0x4e565b,0x745f50,0x4c625b,0x68625b,0x4b4f5d][Math.floor(rnd()*5)];\n      let w2=8+rnd()*7,h2=11+rnd()*30,d2=10+rnd()*7,x2=side*(35+rnd()*12);\n      addBuilding(w2,h2,d2,x2,z+(rnd()-.5)*5,base2,buildingId++);\n    }");html=html.replace("dist=23+rnd()*34","dist=11+rnd()*15");document.open();document.write(html);document.close()}catch(e){document.body.innerHTML=`<div style="padding:30px;max-width:700px"><h1>CITY OUTBREAK</h1><p>The game failed to load.</p><p>${String(e.message||e)}</p><p>Please refresh with Ctrl+F5 in a current Chrome or Edge browser.</p></div>`}</script></body></html>
