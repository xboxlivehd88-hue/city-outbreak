<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Outbreak</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center}#load{padding:30px;text-align:center}small{color:#bbb}</style></head><body><div id="load"><h1>CITY OUTBREAK</h1><p>Loading playable build…</p><small>Chrome or Edge recommended</small></div><script type="module">try{const files=[1,2,3,4,5].map(n=>`./build/game.part${n}?v=61`);const parts=await Promise.all(files.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`Failed to load ${u}`);return(await r.text()).trim()}));const b=parts.join('');const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML=`<div style="padding:30px;max-width:700px"><h1>CITY OUTBREAK</h1><p>The game failed to load.</p><p>${String(e.message||e)}</p><p>Please refresh with Ctrl+F5 in a current Chrome or Edge browser.</p></div>`}</script></body></html>
