<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Outbreak</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center}#load{padding:30px;text-align:center}small{color:#bbb}</style></head><body><div id="load"><h1>CITY OUTBREAK</h1><p>Loading playable build…</p><small>Chrome or Edge recommended</small></div><script type="module">try{const r=await fetch('https://raw.githubusercontent.com/xboxlivehd88-hue/city-outbreak/dc45a0b443f43b6083d2f10de6cb877b0950061f/index.html',{cache:'no-store'});if(!r.ok)throw new Error('Failed to load game build');let page=await r.text();const needle='document.open();document.write(html);document.close()';const patch=`html=html.replace('</body>',\`<script>(function(){addEventListener('DOMContentLoaded',()=>{const shop=document.querySelector('#shop'),cv=document.querySelector('#cv'),ready=document.querySelector('#readyNext');if(!shop||!cv||!ready)return;const syncShop=()=>{if(shop.classList.contains('show')){if(document.pointerLockElement)document.exitPointerLock?.();document.body.style.cursor='default';shop.style.cursor='default';}};new MutationObserver(syncShop).observe(shop,{attributes:true,attributeFilter:['class']});syncShop();ready.addEventListener('click',()=>{document.body.style.cursor='';try{if(document.pointerLockElement!==cv)cv.requestPointerLock?.()}catch(_){}},true);});})();<\\/script></body>\`);document.open();document.write(html);document.close()`;if(!page.includes(needle))throw new Error('Game loader format changed');page=page.replace(needle,patch);document.open();document.write(page);document.close()}catch(e){document.body.innerHTML=`<div style="padding:30px;max-width:700px"><h1>CITY OUTBREAK</h1><p>The game failed to load.</p><p>${String(e.message||e)}</p><p>Please refresh with Ctrl+F5 in Chrome or Edge.</p></div>`}</script></body></html>
